        S.pune("ex.cerere.verificat", true);
      },
      arataCuvinte: function () {
        var t = g.document && g.document.getElementById("c-ex-cuvinte-text");
        if (t) S.pune("ex.cuvinte.text", t.value);
        if (!String(S.ia("ex.cuvinte.text", "")).trim()) { C.eroare = D.cuvinte.gol; return; }
        S.pune("ex.cuvinte.arata", true);
      },
      intrebare: function (v, el) {

        var zona = g.document && g.document.getElementById("eroare");

          if (i < 0) l.push(k);
        } else if (i >= 0) l.splice(i, 1);
        S.pune("ex.intrebari.alese", l); C.eroare = ""; if (zona) zona.textContent = "";
        return false;
      },
      cronometru: function (arg) { var p = String(arg).split("|"); pornesteCeas(p[0], Number(p[1])); return false; },

<script>
/* „Valorile mele” (10 → 5 → 3 → 1, întrebări, note) și „Cum mă văd eu” (scala stimei de sine Rosenberg).
   Adaptate pe vârste: elevii au o listă scurtă și întrebări simple; adulții, lista întreagă. Totul rămâne pe telefon. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, esc = C.esc;
  var V = g.DATE.valoriPers, T = g.DATE.stima;

  function inl(t, v) { Object.keys(v).forEach(function (k) { t = t.split("{" + k + "}").join(v[k]); }); return t; }
  function lista0() { return C.eAdult() ? V.listaAdult : V.listaElev; }
  function ales(k) { return (S.ia("vp.ales.p" + k, []) || []).slice(); }
  /* Lista din care alegi la pasul k: la primul, toată lista; apoi, ce ai ales la pasul de dinainte. */
  function sursa(k) { return k === 0 ? lista0() : ales(k - 1); }
  function urmator(id) { return C.eAdult() && C.module.adult ? C.module.adult.urmator(id) : null; }
  function butonFinal(id) {
    var u = urmator(id);
    return u ? C.buton("Continuă: " + esc(u.t), "nav", u.ecran, "continua") : C.buton("Înapoi la drumul meu", "nav", C.acasa(), "primar");
  }

  /* ---- Valorile mele ---- */
  function intro() {
    var corp = V.intro.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '<p class="mic">' + esc(C.eAdult() ? V.introAdult : V.introElev) + "</p>" + (C.butonLectie ? C.butonLectie("valori") : "") +
      '<ol class="pasi">' + V.pasi.map(function (p) { return "<li>" + esc(p.t) + "</li>"; }).join("") + "</ol>" +
      '<div class="rand">' + C.buton("Începem", "nav", "valorile/p0", "primar") +
      (S.ia("vp.gata", false) ? C.buton("Văd valorile mele", "nav", "valorile/rezultat") : "") + "</div>";
    return C.pagina(V.titlu, corp, C.acasa());
  }

  function pas(k) {
    var P = V.pasi[k], l = sursa(k), a = ales(k);
    var corp = '<p class="mic">Pasul ' + (k + 1) + " din " + V.pasi.length + "</p><p>" + esc(P.ajutor) + "</p>";
    if (P.n === 1) {
      var top = S.ia("vp.top", "");
      corp += '<fieldset class="intrebare"><legend>' + esc(P.t) + "</legend>" + l.map(function (v) {
        return '<label class="val"><input type="radio" name="vp-top" value="' + esc(v) + '" data-camp="vp.top"' + (top === v ? " checked" : "") + "><span>" + esc(v) + "</span></label>";
      }).join("") + "</fieldset>";
    } else {
      corp += '<p class="mic" id="vp-contor" role="status">' + esc(inl(V.contor, { n: a.length, total: P.n })) + "</p>" +
        '<div class="lista-valori">' + l.map(function (v) {
          return '<label class="val"><input type="checkbox" data-chg="valorile.comuta" value="' + k + "|" + esc(v) + '"' + (a.indexOf(v) >= 0 ? " checked" : "") + "><span>" + esc(v) + "</span></label>";
        }).join("") + "</div>";
    }
    corp += '<div class="rand">' + C.buton("Înapoi", "nav", k === 0 ? "valorile/intro" : "valorile/p" + (k - 1)) +
      C.buton("Continuă", "valorile.continua", String(k), "continua") + "</div>";
    return C.pagina(P.t, corp, k === 0 ? "valorile/intro" : "valorile/p" + (k - 1));
  }

  function intrebari() {
    var top = S.ia("vp.top", ""), Q = C.eAdult() ? V.intrebari.adult : V.intrebari.elev;
    if (!top) return pas(3);
    var corp = '<p class="citat">' + esc(top) + "</p>" +
      Q.map(function (q) { return C.camp("vp.r." + q.id, esc(inl(q.t, { v: top })), esc(q.ajutor || ""), 3); }).join("") +
      '<div class="rand">' + C.buton("Înapoi", "nav", "valorile/p3") + C.buton("Continuă", "nav", "valorile/nota", "continua") + "</div>";
    return C.pagina(V.pasi[3].t, corp, "valorile/p3");
  }

  function nota() {
    var N = V.nota, trei = ales(2);
    var corp = "<p>" + esc(N.explica) + '</p><p class="mic">' + esc(C.eAdult() ? N.adult : N.elev) + "</p>" +
      trei.map(function (v, i) {
        var cur = Number(S.ia("vp.nota.v" + i, 0));
        var opt = ""; for (var n = 1; n <= 10; n++) {
          opt += '<label class="opt"><input type="radio" name="vp-n' + i + '" value="' + n + '" data-camp="vp.nota.v' + i + '" data-num="1"' + (cur === n ? " checked" : "") + "><span>" + n + "</span></label>";
        }
        return '<fieldset class="intrebare"><legend>' + esc(v) + '</legend><div class="scala">' + opt + "</div></fieldset>";
      }).join("") +
      '<div class="rand">' + C.buton("Înapoi", "nav", "valorile/intrebari") + C.buton("Văd rezultatul", "valorile.gata", null, "primar") + "</div>";
    return C.pagina(N.titlu, corp, "valorile/intrebari");
  }

  function rezultat() {
    var R = V.rezultat, top = S.ia("vp.top", ""), trei = ales(2);
    if (!top || trei.length < 3) return intro();
    var note = trei.map(function (v, i) { return { v: v, n: Number(S.ia("vp.nota.v" + i, 0)) }; });
    var corp = '<section class="card stil-asertiv"><h2>' + esc(R.cea) + '</h2><p class="citat">' + esc(top) + "</p></section>" +
      '<section class="card"><h2>' + esc(R.top) + "</h2><ul>" + note.map(function (x) {
        return "<li><strong>" + esc(x.v) + "</strong>" + (x.n ? " – contează " + x.n + " din 10" : "") + "</li>";
      }).join("") + "</ul></section>" +
      "<p>" + esc(R.fara) + "</p>" +
      '<p class="termen">' + esc(C.eAdult() ? R.planAdult : R.planElev) + "</p>" +
      C.retine("valori") +
      '<div class="rand">' + C.buton(esc(R.refac), "valorile.refa") + butonFinal("valori") + "</div>";
    return C.pagina(R.titlu, corp, C.acasa());
  }

  C.reg("valorile", {
    ecran: function (sub) {
      var m = /^p([0-3])$/.exec(sub || "");
      if (m) return pas(Number(m[1]));
      if (sub === "intrebari") return intrebari();
      if (sub === "nota") return nota();
      if (sub === "rezultat") return rezultat();
      return intro();
    },
    actiuni: {
      comuta: function (arg, el) {
        var i = String(arg).indexOf("|"), k = Number(String(arg).slice(0, i)), v = String(arg).slice(i + 1), P = V.pasi[k];
        var l = ales(k), j = l.indexOf(v), zona = g.document && g.document.getElementById("eroare");
        if (el.checked) {
          if (l.length >= P.n) { el.checked = false; C.eroare = inl(V.preaMulte, { total: P.n }); if (zona) zona.innerHTML = esc(C.eroare); return false; }
          if (j < 0) l.push(v);
        } else if (j >= 0) l.splice(j, 1);
        S.pune("vp.ales.p" + k, l); C.eroare = ""; if (zona) zona.textContent = "";
        var c = g.document && g.document.getElementById("vp-contor");
        if (c) c.textContent = inl(V.contor, { n: l.length, total: P.n });
        return false;
      },
      continua: function (arg) {
        var k = Number(arg), P = V.pasi[k];
        if (P.n === 1) {
          if (!S.ia("vp.top", "")) { C.eroare = inl(V.preaPutine, { total: 1 }); return; }
          C.mergi("valorile/intrebari"); return;
        }
        if (ales(k).length !== P.n) { C.eroare = inl(V.preaPutine, { total: P.n }); return; }
        /* la pașii următori rămân doar valorile care sunt încă alese */
        for (var u = k + 1; u <= 2; u++) S.pune("vp.ales.p" + u, ales(u).filter(function (v) { return ales(u - 1).indexOf(v) >= 0; }));
        if (ales(2).indexOf(S.ia("vp.top", "")) < 0) S.pune("vp.top", "");
        C.mergi("valorile/p" + (k + 1));
      },
      gata: function () { S.pune("vp.gata", true); C.mergi("valorile/rezultat"); },
      refa: function () { S.pune("vp", {}); C.mergi("valorile/p0"); }
    }
  });

  /* ---- Cum mă văd eu (scala Rosenberg) ---- */
  /* Calcul pur: scorul 10–40; afirmațiile inverse se punctează 5 – răspuns. Întoarce null dacă lipsesc răspunsuri. */
  function scor(r) {
    var s = 0;
    for (var i = 0; i < T.itemi.length; i++) {
      var it = T.itemi[i], v = Number(r && r[it.id]);
      if (!(v >= 1 && v <= 4)) return null;
      s += it.inv ? 5 - v : v;
    }
    return s;
  }
  function stIntro() {
    var corp = T.intro.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '<div class="rand">' + C.buton("Începem", "nav", "stima/p0", "primar") +
      (S.ia("stima.gata", false) ? C.buton("Văd rezultatul", "nav", "stima/rezultat") : "") + "</div>";
    return C.pagina(T.titlu, corp, C.acasa());

    if (D.situatii[sit]) l.push(D.situatii[sit]);
    if (S.ia("varsta", "") === "45+") l.push(D.situatii.accent45);
    return l;
  }

  function hub() {
    var corp = (C.butonLectie ? C.butonLectie("negociere") : "") + D.intro.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      situatie().map(function (t) { return '<p class="termen">' + esc(t) + "</p>"; }).join("") +
      '<div class="meniu-lista">' + D.pasi.map(function (p) {
        var gata = p.id === "fisa" && S.ia("neg.gata", false);
        return C.buton("<strong>" + esc(p.titlu) + "</strong>" + (gata ? '<span class="stare gata">✓ completată</span>' : ""), "nav", "negociere/" + p.id, "lista");
      }).join("") + "</div>" +
      '<p class="nota">' + esc(D.reguli) + "</p>";
    return C.pagina(D.titlu, corp, "adult/meniu");
  }

  function navigare(i) {
    var u = D.pasi[i + 1];
    var urm = C.module.adult && C.module.adult.urmator("negociere");
    return (u ? "" : C.retine("negociere")) + '<div class="rand">' + C.buton("Înapoi", "nav", i === 0 ? "negociere/hub" : "negociere/" + D.pasi[i - 1].id) +
      (u ? C.buton("Continuă", "nav", "negociere/" + u.id, "continua")
        : (urm ? C.buton("Continuă: " + esc(urm.t), "nav", urm.ecran, "continua") : C.buton("Înapoi la drumul meu", "nav", "adult/meniu", "primar"))) + "</div>";
  }

  function pas(id) {
    var i = D.pasi.map(function (p) { return p.id; }).indexOf(id), P = D.pasi[i];
    if (!P) return hub();
    var corp = '<p class="mic">Pasul ' + (i + 1) + " din " + D.pasi.length + "</p>" + (P.text || []).map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("");
    var f = fisa();
    if (id === "piata") {
      corp += '<section class="card"><h2>' + esc(P.surseTitlu) + "</h2><ul>" + P.surse.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") +
        '</ul><p class="mic">' + esc(P.surseNota) + "</p></section>";
    }
    if (id === "fisa") {
      corp += D.fisa.campuri.map(function (c) {
        if (c.tip === "numar") {
          var idc = "c-neg-f-" + c.id;
          return '<div class="camp"><label for="' + idc + '">' + esc(c.t) + '</label><p class="ajutor">' + esc(c.ajutor) + "</p>" +
            '<input id="' + idc + '" type="text" inputmode="numeric" autocomplete="off" data-camp="neg.f.' + c.id + '" value="' + C.escSimplu(f[c.id] || "") + '"></div>';
        }
        return C.camp("neg.f." + c.id, esc(c.t), esc(c.ajutor), 2);
      }).join("") + '<div class="rand">' + C.buton(esc(D.fisa.buton), "negociere.verifica", null, "continua") + "</div>";
      if (S.ia("neg.verificat", false)) {
        var v = verificaFisa(f);
        corp += '<div id="rezultat-fisa">' + (v.ok
          ? '<section class="card stil-asertiv"><h2>' + esc(D.fisa.bine) + '</h2><p class="citat">' + esc(v.fraza) + "</p></section>"
          : '<section class="card"><h2>Ce poți verifica</h2><ul>' + v.probleme.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></section>") + "</div>";
      }
    }
    if (id === "moment") {
      var a = numar(f.intMin), b = numar(f.intMax);
      corp += '<p class="citat">' + esc(inl(P.exemplu, { min: a !== null ? formatLei(a) : "…", max: b !== null ? formatLei(b) : "…" })) + "</p>";
    }
    if (id === "ton" && ["arg1", "arg2", "arg3"].some(function (k) { return String(f[k] || "").trim(); })) {
      corp += '<section class="card"><h2>Argumentele tale</h2><ul>' + ["arg1", "arg2", "arg3"].map(function (k) { return String(f[k] || "").trim(); }).filter(Boolean)
        .map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></section>";
    }
    if (id === "oferta") {
      corp += '<ol class="pasi">' + P.lista.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>" + '<p class="termen">' + esc(P.frica) + "</p>";
      if (String(f.altele || "").trim()) corp += '<section class="card"><h2>Ce altceva contează pentru tine</h2><p>' + esc(f.altele) + "</p></section>";
    }
    if (id === "exercitiu") {
      corp += '<div class="camp"><label for="c-prompt-negociere">Promptul de copiat</label><textarea id="c-prompt-negociere" rows="12" readonly>' +
        C.escSimplu(promptIA(S.ia("scrisoare.r.post", ""), f)) + "</textarea></div>" +
        '<div class="rand">' + C.buton("Copiază", "negociere.copiaza", null, "continua") + '</div><p id="stare-copiere-negociere" class="mic" role="status"></p>' +
        "<details><summary>Prima dată folosești un program de IA? Vezi pașii</summary>" + C.ghidIA() + "</details>" +
        C.camp("neg.dupa", "Ce ai schimba după exercițiu?", "", 3);
    }
    corp += navigare(i);
    return C.pagina(P.titlu, corp, "negociere/hub");
  }

  C.reg("negociere", {
    ecran: function (sub) { return !sub || sub === "hub" ? hub() : pas(sub); },
    actiuni: {
      verifica: function () {
        D.fisa.campuri.forEach(function (c) {
          var el = g.document && g.document.getElementById("c-neg-f-" + c.id);
          if (el) S.pune("neg.f." + c.id, el.value);
        });
        S.pune("neg.verificat", true);
        if (verificaFisa(fisa()).ok) S.pune("neg.gata", true);
        C.deArata = "rezultat-fisa";
      },
      copiaza: function () { C.copiaza("c-prompt-negociere", "stare-copiere-negociere", D.ia.copiat, D.ia.selectat); return false; }
    },
    verificaFisa: verificaFisa,
    promptIA: promptIA
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Agentul principal: desenează ecranul curent, ascultă apăsările și trece conținutul spre module.
   Nu folosește nicio bibliotecă externă și nu face nicio cerere în rețea. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, V = g.Verificator, esc = C.esc;
  var doc = g.document;
  var radacina = doc.getElementById("app");
  var ultimulEcran = null;

  function ecranInitial() {
    var v = S.ia("varsta", "");
    if (!v) return "start";
    if (v === "sub18" && !S.ia("clasa", "")) return "elev/clasa";
    return C.module.sistem.traseu(v);
  }

  function randeaza() {
    var parti = C.ecran.split("/"), nume = parti[0], sub = parti.slice(1).join("/");
    /* Elevii: accent puțin mai viu, litere de 18 px. Adulții și cei peste 45 de ani: mai liniștit, litere mai mari. */
    var varsta = S.ia("varsta", "");
    doc.body.setAttribute("data-traseu", varsta && varsta !== "sub18" ? "adult" : "elev");
    doc.documentElement.setAttribute("data-varsta", varsta || "sub18");
    var m = C.module[nume] || C.module.start;
    var p = m.ecran(sub);
    var schimbat = C.ecran !== ultimulEcran;
    var y = g.scrollY || 0;

    var bara = '<header class="bara">' +
      (p.inapoi ? '<button type="button" class="btn mic-btn" data-act="nav" data-arg="' + esc(p.inapoi) + '" aria-label="Înapoi">← Înapoi</button>' : '<span class="spatiu"></span>') +
      '<span class="nume-app">Orientare în carieră</span>' +
      '<button type="button" class="btn mic-btn" data-act="nav" data-arg="sistem/setari">Setări</button></header>';
    radacina.innerHTML = bara +
      '<main id="continut"><h1 id="titlu" tabindex="-1">' + esc(p.titlu) + "</h1>" +
      '<div id="eroare" class="eroare" role="alert" aria-live="assertive">' + esc(C.eroare) + "</div>" + p.corp + "</main>";

    ultimulEcran = C.ecran;
    if (schimbat) {
      g.scrollTo(0, 0);
      var t = doc.getElementById("titlu");
      if (t) t.focus({ preventScroll: true });
    } else {
      g.scrollTo(0, y);
    }
    if (C.deArata) {
      /* Răspunsul la un buton trebuie să se vadă imediat, chiar dacă e mai jos pe pagină. */
      var tinta = doc.getElementById(C.deArata);
      C.deArata = "";
      if (tinta && tinta.firstChild && tinta.scrollIntoView) tinta.scrollIntoView({ block: "start" });
    }
    if (C.eroare) {
      var e = doc.getElementById("eroare");
      if (e && e.scrollIntoView) e.scrollIntoView({ block: "center" });
    }
  }
  C.reafiseaza = randeaza;

  function actiune(act, arg, el) {
    if (act === "nav") { C.mergi(arg); return true; }
    var parti = act.split("."), m = C.module[parti[0]];
    if (!m || !m.actiuni || typeof m.actiuni[parti[1]] !== "function") return true;
    return m.actiuni[parti[1]](arg, el) !== false;
  }

  doc.addEventListener("click", function (ev) {
    var el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el) return;
    if (actiune(el.getAttribute("data-act"), el.getAttribute("data-arg"), el)) randeaza();
  });

  doc.addEventListener("change", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var chg = el.getAttribute("data-chg");
    if (chg) {
      if (actiune(chg, el.value, el)) randeaza();
      return;
    }
    var cale = el.getAttribute("data-camp");
    if (!cale) return;
    var val = el.value;
    if (el.getAttribute("data-num")) val = Number(val);
    S.pune(cale, val);
    /* Mesajul de eroare dispare după ce omul răspunde. */
    C.eroare = "";
    var zonaEroare = doc.getElementById("eroare");
    if (zonaEroare) zonaEroare.textContent = "";
    /* Oprire blândă dacă textul scris arată un moment greu. */
    if (el.getAttribute("data-text") && V.areSemneCriza(val)) { C.mergi("sistem/criza"); randeaza(); return; }
    /* Unele alegeri schimbă ce se vede pe ecran (de exemplu apare butonul „Am făcut tema”). */
    if (el.getAttribute("data-rerand")) randeaza();
  });

  /* Salvăm și în timpul scrierii, ca să nu se piardă textul dacă se închide pagina. */
  doc.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el && el.getAttribute && el.getAttribute("data-text")) {
      S.pune(el.getAttribute("data-camp"), el.value);
      /* Omul vede că ce a scris nu se pierde. */
      var st = el.parentNode && el.parentNode.querySelector && el.parentNode.querySelector(".salvat-camp");
      if (st) st.textContent = "✓ Salvat";
    }
  });

  C.mergi(ecranInitial());
  randeaza();
  if (C.module.reamintiri) C.module.reamintiri.laDeschidere();

  /* Funcționare fără internet. Merge doar pe https sau localhost. */
  if (false && (g.location.protocol === "https:" || g.location.hostname === "localhost")) {
    g.addEventListener("load", function () { g.navigator.serviceWorker.register("sw.js").catch(function () { /* opțional */ }); });
  }
})(window);

</script>
</body>
