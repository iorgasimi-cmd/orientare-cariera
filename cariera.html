/* ==========================================================================
   TOATE CULORILE APLICAȚIEI SUNT AICI. Dacă vrei să schimbi o culoare, schimb-o doar în acest fișier.
   Regula de contrast: textul trebuie să aibă cel puțin 4,5 față de fundalul lui (7 acolo unde e posibil);
   marginile butoanelor și ale câmpurilor, cel puțin 3. După orice schimbare, rulează:  node teste/contrast.js
   Notă: în manifest.webmanifest, în index.html (meta theme-color) și în icons/icon.svg culorile
   sunt scrise de mână, pentru că acolo nu se pot folosi variabile. Dacă schimbi albastrul principal sau fundalul, schimbă-le și acolo.
   ========================================================================== */

:root {
  /* Fundal și text */
  --fundal: #F6F8FB;            /* alb cald */
  --suprafata: #FFFFFF;         /* cartele și câmpuri */
  --text: #1F2937;              /* gri închis, nu negru pur */
  --text-slab: #4B5563;         /* texte secundare, încă lizibile */

  /* Culoarea principală: albastru de încredere, ales de Simona pentru încredere și siguranță (titluri, bara de progres, butoanele importante) */
  --principal: #1E4E8C;
  --principal-text: #FFFFFF;    /* text pe butonul principal */
  --principal-moale: #E2EBF6;   /* fundal discret, cu text închis deasupra */

  /* Accent cald: chihlimbar (felicitări, pași făcuți, butonul „Continuă”) */
  --cald: #F59E0B;
  --cald-text: #1F2937;         /* text pe chihlimbar: mereu închis, niciodată alb */
  --cald-moale: #FEF1CF;        /* fundal discret pentru felicitări */
  --cald-contur: #B45309;       /* marginea elementelor chihlimbar */

  /* Linii și margini */
  --contur: #6B7280;            /* margini de butoane și câmpuri (contrast cel puțin 3) */
  --linie: #DCE2EA;             /* linii decorative, fără rol de citire */

  /* Erori și atenționări: roșu moale, folosit doar când e nevoie (niciodată pentru rezultatele testelor) */
  --eroare-text: #9B1C1C;
  --eroare-fundal: #FDEEEC;
  --eroare-contur: #C0392B;

  --focus: #1F2937;             /* conturul când navighezi cu tastatura */
  --umbra: rgba(31, 41, 55, .10);
  --verde: #15803D;             /* semnalul „înapoi” (verde, ca la mașină) */
  --principal-sombra: #123A6B;  /* marginea de jos a butoanelor, ca un buton apăsabil */
}

/* Traseul pentru adulți (18+ și 45+): accent mai liniștit */
body[data-traseu="adult"] {
  --cald: #EBBB62;
  --cald-moale: #FAF0DA;
  --cald-contur: #96661A;
}

/* Modul întunecat al telefonului (se aplică automat) */
@media (prefers-color-scheme: dark) {
  :root {
    --fundal: #0F1520;
    --suprafata: #18212D;
    --text: #F1F5F9;
    --text-slab: #B8C3D0;
    --principal: #8FB6EC;
    --principal-text: #0B1626;
    --principal-moale: #233450;
    --cald: #F59E0B;
    --cald-text: #1F2937;
    --cald-moale: #3A3220;
    --cald-contur: #F5B94B;
    --contur: #94A3B8;
    --linie: #2D394A;
    --eroare-text: #FFB4AE;
    --eroare-fundal: #3C2321;
    --eroare-contur: #E08A84;
    --focus: #F1F5F4;
    --umbra: rgba(0, 0, 0, .4);
    --verde: #6FD08C;
    --principal-sombra: #3E6FAE;
  }
  body[data-traseu="adult"] {
    --cald: #E3B25A;
    --cald-moale: #353023;
    --cald-contur: #E8C27A;
  }
}

/* Stil: simplu, calm, încurajator. Culorile sunt în css/culori.css (nu aici).
   Text de cel puțin 16 px peste tot; butoane mari; fără animații; culoarea nu e singurul semn (bife, simboluri, text).
   Elevii: litere de 18 px. Adulții 18–44: 20 px. Cei peste 45 de ani: 22 px. Toate mărimile sunt relative la acestea. */
html { font-size: 18px; -webkit-text-size-adjust: 100%; }
html[data-varsta="18-44"] { font-size: 20px; }
html[data-varsta="45+"] { font-size: 22px; }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fundal); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
#app { max-width: 40rem; margin: 0 auto; }
main { padding: 4px 0 24px; }

/* Titluri */
h1 { font-size: 1.55rem; line-height: 1.25; margin: 8px 0 16px; color: var(--principal); }
h1:focus { outline: none; }
h2 { font-size: 1.15rem; line-height: 1.3; margin: 0 0 8px; color: var(--principal); }
.intrebare-titlu { margin-top: 24px; }
p { margin: 0 0 14px; }

/* Bara de sus */
.bara { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0; }
.nume-app { font-size: .9rem; color: var(--text-slab); text-align: center; flex: 1; }
.spatiu { min-width: 6rem; }

/* Texte mai mici (tot cel puțin 16 px) */
.mic { font-size: .9rem; color: var(--text-slab); }
.nota { font-size: .9rem; color: var(--text-slab); border-left: 4px solid var(--contur); padding-left: 12px; margin-top: 18px; }
.ajutor { font-size: .9rem; color: var(--text-slab); margin: 0 0 6px; }
.citat { font-size: 1.1rem; font-style: italic; border-left: 4px solid var(--principal); padding-left: 12px; }
.termen, .idee { background: var(--principal-moale); padding: 10px 12px; border-radius: 10px; }

/* Felicitări și pași făcuți: accent cald, cu stea sau bifă (nu doar culoare) */
.felicitare {
  background: var(--cald-moale); border: 2px solid var(--cald-contur); border-radius: 12px;
  padding: 12px; font-weight: 600; color: var(--text); margin-top: 12px;
}
.felicitare::before { content: "★ "; color: var(--cald-contur); }
.card.reamintire { border: 2px solid var(--cald-contur); background: var(--cald-moale); }
.card.restanta { border: 2px solid var(--cald-contur); background: var(--cald-moale); }
.card.stil-asertiv { border: 2px solid var(--principal); background: var(--principal-moale); }
.card.varianta h2 { color: var(--text-slab); }
.card.restanta h2 { color: var(--text); }
.card.reamintire h2 { color: var(--text); }
.card.reamintire h2::before { content: "★ "; color: var(--cald-contur); }

/* Atenționări și erori: roșu moale, doar când e nevoie */
.eroare { color: var(--text); font-weight: 600; }
.eroare:not(:empty) { background: var(--cald-moale); border: 2px solid var(--cald-contur); padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
.eroare:not(:empty)::before { content: "Încă un pas: "; }
.alerta { background: var(--eroare-fundal); border: 2px solid var(--eroare-contur); color: var(--eroare-text); padding: 12px; border-radius: 12px; }

/* Cartele */
.card {
  background: var(--suprafata); border: 1px solid var(--linie); border-radius: 14px;
  padding: 16px; margin: 0 0 14px; box-shadow: 0 1px 3px var(--umbra);
}
.card p:last-child { margin-bottom: 0; }

/* Butoane: mari, ușor de apăsat */
.btn {
  font: inherit; font-weight: 600; min-height: 3.1rem; padding: 10px 18px; border-radius: 12px;
  border: 2px solid var(--principal); background: var(--suprafata); color: var(--principal); cursor: pointer;
}
.btn:hover { background: var(--principal-moale); }
.btn:focus-visible, textarea:focus-visible, input[type="date"]:focus-visible, input[type="time"]:focus-visible, input[type="text"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt input:focus-visible + span, .val input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn.primar { background: var(--principal); color: var(--principal-text); }
.btn.primar:hover { background: var(--principal); filter: brightness(1.1); }
.btn.continua { background: var(--cald); color: var(--cald-text); border-color: var(--cald-contur); }
.btn.continua:hover { background: var(--cald); filter: brightness(1.05); }
.btn.salvat { background: var(--cald-moale); border-color: var(--cald-contur); color: var(--text); }
.btn.pericol { border-color: var(--eroare-contur); color: var(--eroare-text); }
.mic-btn { min-height: 2.6rem; padding: 4px 12px; font-size: .9rem; }
.rand { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.rand .btn { flex: 1 1 10rem; }

/* Meniuri */
.meniu-lista { display: grid; gap: 10px; }
.btn.lista { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; width: 100%; min-height: 3.6rem; }
.btn.lista.mare { font-size: 1.1rem; min-height: 4rem; justify-content: center; }
.stare { display: inline-block; font-size: .9rem; font-weight: 400; color: var(--text-slab); }
.stare.gata { font-weight: 700; color: var(--text); background: var(--cald-moale); border: 2px solid var(--cald-contur); border-radius: 999px; padding: 0 10px; }
.pasi { padding-left: 22px; }
.fara-buline, .fara-numar { list-style: none; padding-left: 0; }
.fara-buline li { margin-bottom: 8px; }
.pasi li { margin-bottom: 6px; }

/* Câmpuri de scris */
.camp { margin: 0 0 18px; }
.camp label { display: block; font-weight: 600; margin-bottom: 6px; }
textarea, input[type="date"], input[type="time"], input[type="text"] {
  width: 100%; font: inherit; color: var(--text); background: var(--suprafata);
  border: 2px solid var(--contur); border-radius: 12px; padding: 10px 12px;
}
textarea { resize: vertical; min-height: 5.5rem; }

/* Întrebări cu răspuns de la 1 la 5 */
fieldset.intrebare { border: 1px solid var(--linie); border-radius: 14px; background: var(--suprafata); margin: 0 0 14px; padding: 12px; }
fieldset.intrebare legend { font-weight: 600; padding: 0; float: left; width: 100%; margin: 0 0 8px; }
fieldset.intrebare legend + * { clear: both; }
.legenda-scala { background: var(--principal-moale); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; font-size: .9rem; }
.scala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.scala.trei { grid-template-columns: repeat(3, 1fr); }
.opt { display: block; position: relative; }
.opt input, .val input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt span {
  display: flex; align-items: center; justify-content: center; text-align: center; position: relative;
  min-height: 3.2rem; border: 2px solid var(--contur); border-radius: 12px; font-weight: 700; font-size: 1.15rem; padding: 4px; cursor: pointer;
  background: var(--suprafata);
}
.opt input:checked + span { background: var(--principal); color: var(--principal-text); border-color: var(--principal); }
.opt input:checked + span::after { content: "✓"; position: absolute; top: 0; right: 4px; font-size: .9rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Alegeri cu bifă sau cerc: starea se vede și din simbol, nu doar din culoare */
.val { display: flex; gap: 10px; align-items: flex-start; position: relative; margin: 0 0 10px; }
.val span { flex: 1; border: 2px solid var(--contur); border-radius: 12px; padding: 10px 12px; background: var(--suprafata); cursor: pointer; display: block; }
.val span::before { content: "☐  "; font-weight: 700; }
.val input[type="radio"] + span::before { content: "○  "; }
.val input[type="checkbox"]:checked + span::before { content: "☑  "; color: var(--principal); }
.val input[type="radio"]:checked + span::before { content: "●  "; color: var(--principal); }
.val small { display: block; color: var(--text-slab); font-weight: 400; font-size: .9rem; padding-left: 1.6em; }
.val input:checked + span { border-color: var(--principal); background: var(--principal-moale); }

/* Bara de progres */
.progres { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border: 2px solid var(--contur); border-radius: 999px; background: var(--suprafata); overflow: hidden; display: block; margin-bottom: 8px; }
.progres::-webkit-progress-bar { background: var(--suprafata); }
.progres::-webkit-progress-value { background: var(--principal); }
.progres::-moz-progress-bar { background: var(--principal); }

/* Zilele de lucru din săptămână: bifa și cercul se văd, nu doar culoarea */
.zile { list-style: none; padding: 0; margin: 8px 0 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.zile .zi { text-align: center; border: 2px solid var(--contur); border-radius: 10px; padding: 4px 0; font-weight: 700; background: var(--suprafata); }
.zile .zi.bif { background: var(--principal); color: var(--principal-text); border-color: var(--principal); }
.zile .zi.azi { outline: 3px solid var(--cald-contur); outline-offset: 1px; }

/* Faro, farul prietenos: desenul și bula de vorbă (forma bulei arată cine vorbește, nu doar culoarea) */
.bosi { display: flex; align-items: flex-start; gap: 10px; margin: 4px 0 16px; }
.bosi-desen { flex: 0 0 4.2rem; width: 4.2rem; height: 4.2rem; }
.bosi .bula { position: relative; flex: 1; margin: 6px 0 0; background: var(--suprafata); border: 2px solid var(--principal); border-radius: 14px; padding: 10px 12px; }
.bosi .bula::before { content: ""; position: absolute; left: -9px; top: 14px; border-width: 8px 9px 8px 0; border-style: solid; border-color: transparent var(--principal) transparent transparent; }
.f-raza { fill: var(--cald); fill-opacity: .35; }
.f-acoperis { fill: var(--principal); }
.f-lumina { fill: var(--cald); stroke: var(--principal); stroke-width: 1.5; }
.f-turn { fill: var(--suprafata); stroke: var(--principal); stroke-width: 2.5; stroke-linejoin: round; }
.f-dunga { fill: var(--principal); }
.b-ochi { fill: var(--text); }
.b-trasatura { fill: none; stroke: var(--text); stroke-width: 2.6; stroke-linecap: round; }
.b-obraz { fill: var(--cald-moale); }

/* Drumul cu stații: o linie verticală care leagă stațiile; ✓ = făcut, Bosi + „Ești aici” = pasul de acum */
.drum { list-style: none; margin: 0 0 14px; padding: 0; }
.drum .statie { position: relative; padding-left: 3.6rem; margin: 0 0 12px; }
.drum .statie::before { content: ""; position: absolute; left: 1.45rem; top: 2.6rem; bottom: -14px; border-left: 4px dotted var(--contur); }
.drum .statie:last-child::before { display: none; }
.drum .statie.gata::before { border-left-style: solid; border-left-color: var(--principal); }
.drum .punct { position: absolute; left: 0; top: .3rem; width: 3.1rem; height: 3.1rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--contur); background: var(--suprafata); font-weight: 700; color: var(--text); }
.drum .gata .punct { background: var(--principal); border-color: var(--principal); color: var(--principal-text); font-size: 1.2rem; }
.drum .aici .punct { border-color: var(--cald-contur); background: var(--cald-moale); }
.drum .aici .punct .bosi-desen { width: 2.6rem; height: 2.6rem; }
.drum .aici .btn.lista { border-width: 3px; border-color: var(--cald-contur); }
.eticheta-aici { display: inline-block; font-size: .9rem; font-weight: 700; color: var(--text); background: var(--cald-moale); border: 2px solid var(--cald-contur); border-radius: 999px; padding: 0 10px; margin-bottom: 6px; }

/* Lecțiile scurte: după răspuns, variantele rămân pe ecran cu ✓ (corect) și ✗ (alegerea greșită), nu doar culoare */
.optiune { border: 2px solid var(--contur); border-radius: 12px; padding: 12px 14px; margin: 0; font-weight: 600; background: var(--suprafata); }
.optiune.corect { border-color: var(--principal); background: var(--principal-moale); }
.optiune.gresit { border-style: dashed; }

/* Sărbătorile lui Faro: bula are chenar chihlimbar (plus steluța ★ din text) */
.sarbatoare .bula { border-color: var(--cald-contur); background: var(--cald-moale); }
.sarbatoare .bula::before { border-right-color: var(--cald-contur); }

/* Pentru oamenii care se descurcă greu cu tehnologia */
.salvat-camp { min-height: 1.4em; margin: 4px 0 0; font-size: .9rem; font-weight: 700; color: var(--text); }
.continua-mare .btn { min-height: 4.2rem; }
.btn.continua .stare { color: var(--cald-text); }
.ghid { border: 2px solid var(--principal); border-radius: 14px; padding: 10px; margin-bottom: 14px; background: var(--suprafata); }

/* Stil vesel (variantă A): forme rotunjite, bară de progres, seria de zile, sărbătoare mai vizibilă.
   Culorile rămân cele de încredere: albastru și chihlimbar. */
/* Fond cu un colț colorat sus, ca într-un joc */
body { background: linear-gradient(180deg, var(--principal-moale) 0, var(--fundal) 280px) no-repeat, var(--fundal); }
h1 { font-size: 1.85rem; letter-spacing: -0.01em; }
/* Cartele cu o bandă colorată în stânga */
.card { border-radius: 20px; border-left: 7px solid var(--principal); }
.card.stil-asertiv, .card.servicii { border-left-color: var(--cald); }
/* Butoane 3D: un buton „se apasă” */
.btn { border-radius: 16px; border-bottom-width: 5px; }
.btn.primar { border-bottom-color: var(--principal-sombra); }
.btn.continua { border-bottom-color: var(--cald-contur); }
.btn:active { transform: translateY(3px); border-bottom-width: 2px; }
.drum .punct { width: 3.4rem; height: 3.4rem; border-width: 4px; }
.progres-drum { margin: 0 0 8px; }
.progres-drum .mic { margin: 0 0 4px; }
.rand-mic { margin-top: 2px; }
.rand-mic .btn { min-height: 2.5rem; font-size: .9rem; }
.progres-drum .progres { height: 18px; }
.seria { font-weight: 700; color: var(--cald-contur); margin: 0 0 14px; }
.flacara { color: var(--cald); font-size: 1.1rem; }
.sarbatoare .bula { animation: sarbatoare-pop .6s ease-out 1; }
@keyframes sarbatoare-pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

/* Roata vieții profesionale */
.roata { display: block; width: 100%; max-width: 20rem; height: auto; margin: 0 auto 8px; }
.roata .cerc { fill: none; stroke: var(--linie); stroke-width: 1.5; }
.roata .ax { stroke: var(--linie); stroke-width: 1.5; }
.roata .felie { fill: var(--principal); fill-opacity: .8; stroke: var(--suprafata); stroke-width: 2; }
.roata .nr { fill: var(--text); font-size: 18px; font-weight: 700; }

.fara-js { padding: 16px; font-weight: 600; }

@media (max-width: 359px) { .nume-app { display: none; } }

details { margin: 14px 0; }
details > summary { cursor: pointer; font-weight: 600; color: var(--principal); min-height: 2.6rem; padding: 8px 0; }
details > summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Semnalizare, ca la mașină: „înainte” clipește chihlimbar, „înapoi” clipește verde.
   Clipirea e lentă (un ciclu la 1,2 secunde, sub pragul care poate provoca probleme) și doar în conținut, nu în antet.
   Cei care au oprit animațiile în telefon văd doar un contur și o săgeată. */
main .btn.semn-inainte { border-color: var(--cald-contur); border-width: 3px; animation: semnal-inainte 1.2s steps(1, end) infinite; }
main .btn.semn-inapoi { border-color: var(--verde); border-width: 3px; animation: semnal-inapoi 1.2s steps(1, end) infinite; }
@keyframes semnal-inainte { 0%, 49% { box-shadow: 0 0 0 5px var(--cald); } 50%, 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes semnal-inapoi { 0%, 49% { box-shadow: 0 0 0 5px var(--verde); } 50%, 100% { box-shadow: 0 0 0 0 transparent; } }
.flecha { font-weight: 700; }
@media (prefers-reduced-motion: reduce) {

    var ik = D.ikigai.filter(function (q) { return S.ia("forte.ik." + q.id, ""); });

    if (vs.length) corp += '<section class="card"><h2>Ce contează pentru tine</h2><ul>' + vs.map(function (id) {

      return v ? "<li>" + esc(v.t) + "</li>" : "";
    }).join("") + "</ul></section>";
    if (!mom.length && !ik.length && !vs.length) corp += "<p>Încă nu ai scris nimic aici. Te poți întoarce oricând.</p>";
    var rec = S.ia("forte.recunosc", "");
    corp += '<fieldset class="intrebare"><legend>Te recunoști în ce ai citit?</legend><div class="scala trei">' +
      [["da", "Da"], ["aproape", "În mare parte"], ["nu", "Nu prea"]].map(function (o) {
        return '<label class="opt"><input type="radio" name="recunosc" value="' + o[0] + '" data-camp="forte.recunosc"' + (rec === o[0] ? " checked" : "") + "><span>" + o[1] + "</span></label>";
      }).join("") + "</div></fieldset>" +
      C.camp("forte.schimb", "Ce ai schimba sau ai adăuga?", "", 3) +
      C.retine("forte") +
      '<div class="rand">' + C.buton("Înapoi", "nav", "forte/valori") + (C.eAdult() ? butonUrmator("forte") : C.buton("Continuă: meserii", "nav", "meserii/lista", "continua")) + "</div>";
    return C.pagina("Ce ai spus despre tine", corp, C.acasa());
  }

  C.reg("forte", {
    ecran: function (sub) {
      if (sub === "intro" || !sub) return intro();
      var m = /^m([0-2])$/.exec(sub); if (m) return moment(Number(m[1]), sub);

          if (i < 0) alese.push(val);
        } else if (i >= 0) alese.splice(i, 1);
        S.pune("forte.valori", alese);
        C.eroare = "";
        var nr = g.document && g.document.getElementById("nr-valori");
        if (nr) nr.textContent = alese.length;
        var zona = g.document && g.document.getElementById("eroare");
        if (zona) zona.textContent = "";
        return false; /* nu redesenăm: păstrăm poziția pe ecran */
      },
      valori_gata: function () {

      }
    }
  });
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* Subagent 6: meserii și domenii.
   Propune 5–8 domenii pe baza primelor trei tipuri din test și a valorilor alese.
   Nu spune „aceasta e meseria ta”, ci „poate te interesează”. Elevul salvează ce îi place. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, D = g.DATE.meserii, V = g.DATE.valori, esc = C.esc;
  var MAX_AFISATE = 8;

  /* Calcul pur: scor = potrivire cu tipurile (3, 2, 1 puncte) + 1 punct pentru fiecare valoare comună. */
  function clasament(top, valori) {
    return D.lista.map(function (m) {
      var scor = 0;
      (top || []).forEach(function (t, i) { if (m.tipuri.indexOf(t) >= 0) scor += 3 - i; });
      (valori || []).forEach(function (v) { if (m.valori.indexOf(v) >= 0) scor += 1; });
      return { m: m, scor: scor };
    }).filter(function (x) { return x.scor > 0; })
      .sort(function (a, b) { return b.scor - a.scor || a.m.nume.localeCompare(b.m.nume, "ro"); });
  }

  function cartela(m) {
    var salvata = S.ia("meserii.salvate", []).indexOf(m.id) >= 0;
    return '<section class="card meserie"><h2>' + esc(m.nume) + "</h2>" +
      "<p><strong>Ce face:</strong> " + esc(m.ceFace) + "</p>" +
      "<p><strong>Ce se învață:</strong> " + esc(m.ceInvata) + "</p>" +
      "<p><strong>Ce drumuri duc spre ea:</strong> " + esc(m.drumuri) + "</p>" +
      "<p><strong>Alte drumuri:</strong> " + esc(m.alte) + "</p>" +
      '<div class="rand">' + C.buton(salvata ? "✓ Salvată (apasă ca să scoți)" : "Mă interesează, o salvez", "meserii.salveaza", m.id, salvata ? "salvat" : "") + "</div></section>";
  }

  function lista() {
    var top = S.ia("interese.top", null);
    if (!top) {
      return C.pagina("Meserii și domenii",
        "<p>Ca să-ți arăt idei potrivite, mai întâi am nevoie de testul de interese.</p>" +
        '<div class="rand">' + C.buton("Fac testul", "nav", "interese/intro", "primar") + C.buton("Vreau să văd toate domeniile", "nav", "meserii/toate") + "</div>");
    }
    var cl = clasament(top, S.ia("forte.valori", [])).slice(0, MAX_AFISATE);
    var corp = "<p>Pe baza răspunsurilor tale, poate te interesează aceste domenii. Sunt doar idei: poți salva ce ți se pare interesant.</p>" +
      '<p class="nota">' + esc(D.nota) + "</p>";
    corp += cl.map(function (x) { return cartela(x.m); }).join("");
    corp += C.retine("meserii");
    corp += '<div class="rand">' + C.buton("Văd domeniile salvate", "nav", "meserii/salvate") + C.buton("Văd toate domeniile", "nav", "meserii/toate") +
      C.buton("Continuă: planul meu", "nav", "plan/hub", "continua") + "</div>";
    return C.pagina("Poate te interesează", corp);
  }

  function toate() {
    var corp = '<p class="nota">' + esc(D.nota) + "</p>" + D.lista.map(cartela).join("");
    return C.pagina("Toate domeniile", corp, "meserii/lista");
  }

  function salvate() {
    var ids = S.ia("meserii.salvate", []);
    var corp = ids.length ? D.lista.filter(function (m) { return ids.indexOf(m.id) >= 0; }).map(cartela).join("") :
      "<p>Nu ai salvat încă nimic. Când găsești un domeniu care ți se pare interesant, apasă „Mă interesează”.</p>";
    return C.pagina("Domeniile salvate", corp + '<p class="nota">' + esc(D.nota) + "</p>", "meserii/lista");
  }

  C.reg("meserii", {
    ecran: function (sub) { return sub === "toate" ? toate() : sub === "salvate" ? salvate() : lista(); },
    actiuni: {
      salveaza: function (id) {
        var l = S.ia("meserii.salvate", []).slice(), i = l.indexOf(id);
        if (i >= 0) l.splice(i, 1); else l.push(id);
        S.pune("meserii.salvate", l);
      }
    },
    clasament: clasament
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Subagent 3: plan și teme săptămânale.
   Scop în stil SMART, trei teme pe săptămână (ușoară, potrivită, mai grea) din care omul alege una,
   obiceiuri mici (când, unde, după ce, varianta de 2 minute, o mică bucurie), întrebarea „ce fel de om”,
   cele 5 obstacole (4.3), exercițiul „ce vreau, ce m-ar putea opri, ce fac atunci” (planul „Dacă…, atunci…”), convingeri limitative (5.1), recadrare (5.3), privire înapoi (7.1).
   Cele trei nevoi de motivație: autonomie, competență, relaționare. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, D = g.DATE.sfaturi, esc = C.esc;

  var SCOP = [
    { c: "intentie", lit: "Intenția", exp: "Începem cu ce ți-ai dori, în cuvinte simple.",

      qAdult: "Ce ți-ai dori să se întâmple sau să începi, în următoarele luni, în legătură cu munca sau cariera ta?" },
    { c: "specific", lit: "S – specific", exp: "Un scop clar spune exact ce faci. „Un job mai bun” e vag; „Vorbesc cu două persoane care lucrează ca…” e clar.",
      expElev: "Un scop clar spune exact ce faci. „Să aflu ce mi se potrivește” e vag; „Vorbesc cu două persoane care lucrează ca…” e clar.",
      q: "Spune într-o propoziție ce vrei să faci, cât mai clar." },
    { c: "masurabil", lit: "M – măsurabil", exp: "Ca să știi că ai reușit, ai nevoie de ceva ce poți număra sau bifa.",
      q: "Cum vei ști că ai reușit? Ce poți număra sau bifa?" },
    { c: "realizabil", lit: "A – realizabil", exp: "Scopul trebuie să fie ceva ce poți face cu ce ai acum.",
      q: "Ce ai deja sau ce poți face ca să ți se întâmple acest lucru? Ce ți se pare greu?" },
    { c: "relevant", lit: "R – relevant", exp: "Scopul trebuie să conteze pentru tine, nu doar pentru alții.",
      q: "Cum se leagă acest scop de ce ai aflat despre tine (test, puncte forte, valori)?" },
    { c: "termen", lit: "T – cu termen", exp: "O dată anume te ajută să începi.", q: "Până când vrei să ajungi aici?", data: true }
  ];

  /* Trei teme pe săptămână: una ușoară, una potrivită, una mai grea, alese rotativ din bancă. Calcul pur. */
  function temeSaptamanii(idx) {
    var b = C.eAdult() ? D.teme_adulti : D.teme_saptamanale;
    return [1, 2, 3].map(function (nv) {
      var l = b.filter(function (t) { return t.nivel === nv; });
      return l[idx % l.length];
    });
  }
  /* Fraza „Voi face tema marți, la ora 18, la birou, după ce beau cafeaua.” din ce a scris omul. */
  function frazaObicei(cale) {
    var O = D.obicei, p = [S.ia(cale + ".cand", ""), S.ia(cale + ".unde", "")].map(function (x) { return String(x || "").trim(); }).filter(Boolean);
    var dupa = String(S.ia(cale + ".dupa", "") || "").trim();
    if (!p.length && !dupa) return "";
    return O.fraza + (p.length ? " " + p.join(", ") : "") + (dupa ? (p.length ? ", " : " ") + "după ce " + dupa.replace(/^după ce\s+/i, "") : "") + ".";
  }

  /* ---- Progresul zilnic ---- */
  function zileLucru() { return (S.ia("plan.zile", []) || []).slice().sort(); }
  /* Calcul pur: câte zile la rând, până azi (sau până ieri, dacă azi încă nu a bifat). */
  function serie(zile, azi) {
    var set = {}; zile.forEach(function (z) { set[z] = true; });
    var d = set[azi] ? azi : C.adauga(azi, -1), n = 0;
    while (set[d]) { n++; d = C.adauga(d, -1); }
    return n;
  }
  /* Calcul pur: a lucrat înainte, dar nici ieri, nici azi. */
  function aSarit(zile, azi) {
    if (!zile.length || zile.indexOf(azi) >= 0) return false;
    return zile[zile.length - 1] < C.adauga(azi, -1);
  }
  function cardProgres(idx) {
    var P = D.progres, z = zileLucru(), azi = C.azi(), st = S.ia("plan.start", azi), facutAzi = z.indexOf(azi) >= 0;
    var zi0 = C.adauga(st, idx * 7), rand = "";
    for (var k = 0; k < 7; k++) {

      '<ul class="zile">' + rand + "</ul>" +

      '<div class="rand">' + C.buton(facutAzi ? P.butonFacut : esc(P.buton), "plan.azi", null, facutAzi ? "salvat" : "continua") + "</div>" +
      (facutAzi ? '<p class="felicitare" role="status">' + esc(P.felicitari[z.length % P.felicitari.length]) + "</p>" : "");
    if (aSarit(z, azi)) {
      var mini = String(S.ia("plan.sapt.s" + idx + ".mini", "") || "").trim();
      corp += '<div class="termen" role="status"><p>' + esc(P.sarit) + "</p>" + (mini ? "<p><strong>" + C.escSimplu(mini) + "</strong></p>" : "") + "</div>" +
        C.camp("plan.ajuta", esc(P.ajuta), esc(P.ajutaEx), 2);
    }
    return corp + "</section>";
  }
  function cardPrieten(idx) {

    var txt = P.prietenText.replace("{tema}", tema).replace("{obicei}", fr ? fr + " " : "");
    return '<section class="card"><h2>' + esc(P.prietenTitlu) + "</h2><p>" + esc(P.prietenExplica) + "</p>" +
      '<div class="camp"><label for="c-prieten">Mesajul</label><textarea id="c-prieten" rows="4" readonly>' + C.escSimplu(txt) + "</textarea></div>" +
      '<div class="rand">' + C.buton(esc(P.copiaza), "plan.copiaza_prieten") + '</div><p id="stare-prieten" class="mic" role="status"></p>' +
      C.camp("plan.ajutor", esc(D.idei.ajutor), esc(D.idei.ajutorEx), 2) + "</section>";
  }
  /* Săptămânile terminate la rând, înainte de cea de acum. Calcul pur. */
  function saptLaRand(idx) { var n = 0; for (var k = idx - 1; k >= 0 && S.ia("plan.sapt.s" + k + ".bifat", false); k--) n++; return n; }

  /* „Dacă [obstacol], atunci [plan].” din răspunsurile omului. Calcul pur. */
  function frazaWoop() {
    var W = D.woop, o = String(S.ia("plan.woop.obstacol", "") || "").trim(), p = String(S.ia("plan.woop.plan", "") || "").trim();
    if (!o || !p) return "";
    o = o.replace(/^dac[ăa]\s+/i, "").replace(/[.!]+$/, ""); p = p.replace(/^atunci\s+/i, "").replace(/[.!]+$/, "");

  }
  function woop() {
    var W = D.woop, fr = frazaWoop();
    var corp = "<p>" + esc(W.intro) + "</p>" +
      C.camp("plan.woop.dorinta", esc(W.dorinta), esc(C.eAdult() ? W.dorintaAdult : W.dorintaElev), 2) +
      C.camp("plan.woop.rezultat", esc(W.rezultat), esc(W.rezultatAjutor), 2) +
      C.camp("plan.woop.obstacol", esc(W.obstacol), esc(W.obstacolAjutor), 2) +
      C.camp("plan.woop.plan", esc(W.plan), esc(W.planAjutor), 2) +
      '<div class="rand">' + C.buton("Văd planul meu", "plan.woop_gata", null, "primar") + "</div>" +
      '<div id="woop-fraza" role="status">' + (fr ? '<section class="card stil-asertiv"><h2>' + esc(W.fraza) + '</h2><p class="citat">' + C.escSimplu(fr) + "</p></section>" : "") + "</div>" +
      '<div class="rand">' + C.buton("Înapoi la plan", "nav", "plan/hub") + "</div>";

      (scop ? '<p class="citat">' + esc(scop) + "</p>" +

      "</section>" +
      '<section class="card"><h2>Tema săptămânii</h2><p>Alegi tu una din trei teme mici: una ușoară, una potrivită și una mai grea. Sau îți scrii propria temă.</p><div class="rand">' + C.buton("Văd temele", "nav", "plan/saptamana", "primar") + "</div></section>" +
      '<section class="card"><h2>' + esc(D.woop.titlu) + "</h2><p>" + esc(D.woop.hub) + "</p>" + (frazaWoop() ? '<p class="citat">' + C.escSimplu(frazaWoop()) + "</p>" : "") +
        '<div class="rand">' + C.buton(frazaWoop() ? "Îl schimb" : "Încep", "nav", "plan/woop", frazaWoop() ? "" : "primar") + "</div></section>" +
      '<section class="card"><h2>Ce m-ar putea opri</h2><p>Cele mai frecvente obstacole, și o idee pentru fiecare.</p><div class="rand">' + C.buton("Văd obstacolele", "nav", "plan/obstacole") + C.buton("Un gând care mă oprește", "nav", "plan/convingere") + "</div></section>" +
      '<section class="card"><h2>Privire înapoi</h2><p>Ce a mers, ce a rămas, ce schimb.</p><div class="rand">' + C.buton("Mă uit înapoi", "nav", "plan/privire") + "</div></section>" +
      '<p class="nota"><strong>Tu alegi scopul, pașii și ritmul.</strong> Aici propun, nu hotărăsc eu.</p>';
    return C.pagina("Planul meu", corp);
  }

  function scopPas(i) {
    var s = SCOP[i];
    var corp = '<p class="mic">Pasul ' + (i + 1) + " din " + SCOP.length + "</p>" +
      '<p class="termen"><strong>' + esc(s.lit) + ".</strong> " + esc(!C.eAdult() && s.expElev ? s.expElev : s.exp) + "</p>";
    if (s.data) {

    });

    corp += C.camp("plan.identitate", esc(I.q), esc(C.eAdult() ? I.exAdult : I.exElev), 2);

      '<div class="rand">' + C.buton("Îl las așa", "nav", "plan/hub", "primar") + C.buton("Vreau să-l schimb", "nav", "plan/scop0") + "</div>";

  /* Ultima zi a săptămânii cu numărul idx (0 = prima), ca AAAA-LL-ZZ. */
  function dataSf(idx) { var st = S.ia("plan.start", null); return st ? C.adauga(st, idx * 7 + 6) : ""; }
  function textTema(k) {
    var s = S.ia("plan.sapt.s" + k, {}) || {};
    if (s.aleasa === "proprie") return s.proprie || "Tema ta";
    var t = D.teme_saptamanale.concat(D.teme_adulti).filter(function (x) { return x.id === s.aleasa; })[0];
    return t ? t.t : "";
  }
  /* Săptămâni trecute în care omul a ales o temă și n-a făcut-o până la termen (și n-a închis-o). Calcul pur. */
  function restante() {
    var idx = C.saptamana(), rez = [];
    for (var k = 0; k < idx; k++) {
      var s = S.ia("plan.sapt.s" + k, null);
      if (s && s.aleasa && !s.bifat && !s.inchisa) rez.push(k);
    }
    return rez;
  }
  function cardRestanta() {
    var r = restante();

  function privire() {

      C.camp("plan.privire.mers", "Ce a mers bine?", "", 3) +

  C.reg("plan", {
    ecran: function (sub) {

      if (sub === "saptamana") return saptamana();
      if (sub === "obstacole") return obstacole();
      if (sub === "woop") return woop();
      if (sub === "convingere") return convingere();
      if (sub === "privire") return privire();
      return hub();
    },
    actiuni: {
      woop_gata: function () { C.deArata = "woop-fraza"; },
      azi: function () {
        var z = zileLucru(), a = C.azi(), i = z.indexOf(a);
        if (i >= 0) z.splice(i, 1); else z.push(a);
        S.pune("plan.zile", z); C.deArata = "progres";
      },
      copiaza_prieten: function () { C.copiaza("c-prieten", "stare-prieten", D.progres.copiat, D.progres.selectat); return false; },
      scop_gata: function () {
        if (!S.ia("plan.start", null)) S.pune("plan.start", C.azi());
        C.mergi("plan/scopRez");

        S.pune(cale, !S.ia(cale, false));
        S.pune("plan.sapt.s" + idx + ".nefacut", "");

        C.deArata = "mesaj-tema";
      },
      /* Termenul a trecut: omul alege o altă temă (sau un pas mai mic). Temele vechi nefăcute se închid. */
      schimba: function () {

      nefacut: function (idx) {
        var c = "plan.sapt.s" + idx;

      alta: function (idx) {
        var c = "plan.sapt.s" + idx;
        S.pune(c + ".aleasa", ""); S.pune(c + ".nefacut", ""); S.pune(c + ".mai_tarziu", ""); S.pune(c + ".bifat", false);
      },
      obstacol: function (id, el) { S.pune("plan.obst." + id + ".da", !!el.checked); return false; }

</script>
<script>
/* Subagent 7: sfaturi scurte pentru elevi, de citit în sub un minut, pe patru teme.
   Se potrivesc cu clasa: IX–X explorare, XI–XII alegerea unui prim pas. Nu spun elevului ce să aleagă. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, D = g.DATE.sfaturi, esc = C.esc;

  function sfaturiPentru(tema) {
    var grupe = C.grupa();
    return D.sfaturi.filter(function (s) { return s.tema === tema && grupe.indexOf(s.grupa) >= 0; });
  }

  function lista() {
    var clasa = S.ia("clasa", "");
    var corp = "<p>Sfaturi scurte, de citit în câteva secunde. Alege o temă.</p>" +
      (clasa === "9" || clasa === "10" ? '<p class="mic">' + esc(D.grupe.explorare) + "</p>" :
        clasa === "11" || clasa === "12" ? '<p class="mic">' + esc(D.grupe.alegere) + "</p>" : "");
    corp += '<div class="meniu-lista">';
    D.teme.forEach(function (t) {
      corp += C.buton("<strong>" + esc(t.titlu) + "</strong>", "nav", "sfaturi/" + t.id, "lista");
    });
    corp += "</div>" + (C.butonDatele ? C.butonDatele() : "");
    return C.pagina("Sfaturi", corp);
  }

  function tema(id) {
    var t = D.teme.filter(function (x) { return x.id === id; })[0];
    if (!t) return lista();
    var corp = sfaturiPentru(id).map(function (s) { return '<section class="card"><p>' + esc(s.t) + "</p></section>"; }).join("");
    corp += '<div class="rand">' + C.buton("Văd alte teme", "nav", "sfaturi/lista", "primar") + "</div>";
    return C.pagina(t.titlu, corp, "sfaturi/lista");
  }

  C.reg("sfaturi", {
    ecran: function (sub) { return !sub || sub === "lista" ? lista() : tema(sub); },
    actiuni: {},
    sfaturiPentru: sfaturiPentru
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Subagent 4: reamintiri și progres.

(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, D = g.DATE.sfaturi, esc = C.esc;

  /* Mesajul potrivit pentru ziua de azi. Calcul pur: primește starea și ziua săptămânii (0 = duminică). */
  function mesajPentru(idx, bifatAzi, ziSapt, bifatPrecedenta, areAlesa) {
    if (bifatAzi) return D.mesaje.felicitare[idx % D.mesaje.felicitare.length];
    if (idx > 0 && !bifatPrecedenta && !areAlesa) return D.mesaje.fara_tema;
    if (ziSapt === 1) return D.mesaje.inceput;
    if (ziSapt >= 3 && ziSapt <= 4) return D.mesaje.mijloc;
    return areAlesa ? "Ai ales o temă pentru săptămâna asta. O poți face în ritmul tău." : "Poți alege o temă mică pentru săptămâna asta.";
  }

  function mesajAzi() {

    var prec = idx > 0 ? S.ia("plan.sapt.s" + (idx - 1), {}) : {};
    return mesajPentru(idx, !!cur.bifat, new Date().getDay(), !!(prec && prec.bifat), !!cur.aleasa);
  }

  /* Reamintirea din aplicație: cât timp tema aleasă nu e bifată, apare tema și butoanele pentru ea. */
  function banner() {
    if (!S.ia("plan.start", null)) return "";
    var pl = C.module.plan, idx = C.saptamana(), cur = S.ia("plan.sapt.s" + idx, {}) || {};
    var asteapta = !!cur.aleasa && !cur.bifat;
    var corp = '<section class="card reamintire" role="status"><h2>Pe scurt, azi</h2><p>' + esc(mesajAzi()) + "</p>";
    if (asteapta && pl) {
      var sf = pl.dataSf(idx);
      corp += '<p class="citat">' + esc(pl.textTema(idx)) + "</p>" + (sf ? '<p class="mic">Termen: ' + esc(C.format(sf)) + "</p>" : "") +
        '<div class="rand">' + C.buton("Am făcut tema", "plan.bifeaza", String(idx), "primar") + C.buton("Fac tema mai târziu", "plan.maitarziu", String(idx)) + "</div>";
    } else if (pl && pl.restante().length) {
      corp += '<div class="rand">' + C.buton("Văd tema nefăcută", "nav", "plan/hub", "primar") + "</div>";
    }
    return corp + "</section>";
  }

  function laDeschidere() {
    /* Doar dacă omul a cerut notificări și browserul le permite. Nu garantăm livrarea. */
    try {
      var pl = C.module.plan, idx = C.saptamana(), cur = S.ia("plan.sapt.s" + idx, {}) || {};
      /* Notificăm doar cât timp o temă nu e bifată (a săptămânii sau una cu termen depășit). */
      var asteapta = (!!cur.aleasa && !cur.bifat) || !!(pl && pl.restante().length);
      if (asteapta && S.ia("rem.notif", false) && g.Notification && g.Notification.permission === "granted" && S.ia("plan.start", null)) {
        var azi = C.azi();
        if (S.ia("rem.ultima", "") !== azi) {
          new g.Notification("Orientare în carieră", { body: mesajAzi() });
          S.pune("rem.ultima", azi);

  }

  /* ---- Reamintire în calendarul telefonului (fișier .ics) ----
     Telefonul trimite singur alarma, fără server. Nu știe când bifezi tema: omul șterge evenimentul când termină. */
  function escIcs(t) { return String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
  function octeti(c) { var x = c.codePointAt(0); return x < 0x80 ? 1 : x < 0x800 ? 2 : x < 0x10000 ? 3 : 4; }

      var o = octeti(ch);

    });

  /* Calcul pur. opt: text, ora ("HH:MM"), azi (AAAA-LL-ZZ), acum ("HH:MM"), termen (AAAA-LL-ZZ), idx, stamp ("AAAALLZZTHHMMSSZ"). */
  function construiesteIcs(opt) {
    var h = String(opt.ora || "18:00").split(":"), hh = ("0" + (h[0] || "18")).slice(-2), mm = ("0" + (h[1] || "00")).slice(-2);
    var start = opt.azi;
    if (opt.acum >= hh + ":" + mm) start = C.adauga(opt.azi, 1); /* ora de azi a trecut: începem mâine */
    var repeta = start <= opt.termen;
    var fin = Math.min(Number(hh) * 60 + Number(mm) + 15, 23 * 60 + 59);
    var sfarsit = ("0" + Math.floor(fin / 60)).slice(-2) + ("0" + (fin % 60)).slice(-2);
    var data = start.replace(/-/g, "");
    var scurt = String(opt.text || "").length > 80 ? String(opt.text).slice(0, 77) + "…" : String(opt.text || "");
    var desc = "Tema mea: " + (opt.text || "") + " Când ai făcut-o, șterge acest eveniment din calendar.";

  function norm(s) {
    return String(s || "").replace(/ţ/g, "ț").replace(/Ţ/g, "Ț").replace(/ş/g, "ș").replace(/Ş/g, "Ș")
      .normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function mesaj(m, valori) {
    var t = m.t !== undefined ? m.t : m;
    Object.keys(valori || {}).forEach(function (k) { t = t.split("{" + k + "}").join(valori[k]); });
    return t;
  }

  var TITLURI = [
    ["rezumat", /^(rezumat|profil( profesional)?|obiectiv( profesional)?|despre mine|prezentare)$/],
    ["experienta", /^(experienta( profesionala| de munca)?|istoric profesional|experienta profesionala relevanta)$/],
    ["educatie", /^(educatie( si formare)?|studii|formare( profesionala)?|educatie si formare profesionala)$/],
    ["competente", /^(competente( si abilitati| tehnice| digitale| personale)?|abilitati( personale)?|aptitudini)$/],
    ["limbi", /^limbi( straine)?$/],
    ["proiecte", /^(proiecte|voluntariat|proiecte ?\/ ?voluntariat|activitati de voluntariat)$/],
    ["personale", /^(date personale|informatii personale|date de contact|contact)$/],
    ["hobby", /^(hobby(-uri)?|pasiuni|interese)$/]
  ];
  var NUME_SECTIUNE = { rezumat: "Rezumat", experienta: "Experiență profesională", educatie: "Educație", competente: "Competențe" };
  var BULINA = /^\s*([•\-*–●▪◦·]|\d+[.)])\s+/;

  /* Împarte textul pe secțiuni, după titluri. Ce e înainte de primul titlu e partea de sus (numele și contactul). */
  function sectiuni(text) {
    var rez = { sus: [] }, curent = "sus";
    String(text).split(/\r?\n/).forEach(function (linie) {
      var curata = norm(linie).replace(BULINA, "").replace(/[:\s]+$/, "").trim();
      if (curata && curata.length <= 45) {
        for (var i = 0; i < TITLURI.length; i++) {
          if (TITLURI[i][1].test(curata)) { curent = TITLURI[i][0]; rez[curent] = rez[curent] || []; return; }
        }
      }
      rez[curent] = rez[curent] || [];
      rez[curent].push(linie);
    });
    return rez;
  }

  var VERBE = /\b(am (coordonat|condus|organizat|gestionat|crescut|redus|implementat|creat|dezvoltat|negociat|vandut|rezolvat|instruit|format|imbunatatit|lansat|realizat|obtinut|depasit|reactivat|monitorizat|planificat|analizat|construit|proiectat|predat|livrat|optimizat|automatizat|recrutat|consiliat|administrat|supervizat|elaborat|initiat|atras|castigat|ingrijit|scris)|coordonarea|gestionarea|negocierea|organizarea|depasirea|reducerea|cresterea|implementarea|dezvoltarea|monitorizarea|rezolvarea|reactivarea|intocmirea|preluarea|identificarea|planificarea|optimizarea|instruirea|crearea|lansarea|administrarea|elaborarea)\b/g;
  var REZULTAT = /(\d+\s*%|\d[\d.,]*\s*(de\s+)?(clien|lei|ron|euro|eur|oameni|persoane|proiect|produse|comenzi|ore|zile|luni|km|participan|angaja|membri|magazine|locatii|vanzari|elevi|copii|pacienti|cursanti|evenimente|contracte|apeluri)|\bcu \d+|\bde la \d+ la \d+)/;

  /* Calcul pur: primește textul, răspunsurile la întrebări și situația; întoarce ce e bine și ce se poate schimba. */
  function analizeaza(text, raspunsuri, context) {
    var M = D.mesaje, bine = [], schimba = [], n = norm(text);
    var adauga = function (m, valori) { schimba.push({ p: m.p, t: mesaj(m, valori) }); };
    var cuvinte = String(text).split(/\s+/).filter(Boolean).length;
    var sec = sectiuni(text);

    if (cuvinte < 80) adauga(M.scurt);

    /* Date de contact: nume, telefon, e-mail profesional, oraș */
    var email = String(text).match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
    if (email) {
      bine.push(M.email_ok);
      var local = norm(email[0].split("@")[0]);
      if (D.cuvinte.porecle.some(function (w) { return local.indexOf(w) >= 0; })) adauga(M.email_neprof);
    } else adauga(M.email_lipsa);
    if (/(\+?40|\b0)\s?7\d{2}[\s.-]?\d{3}[\s.-]?\d{3}\b|(\+?40|\b0)\s?[23]\d{1,2}[\s.-]?\d{3}[\s.-]?\d{3,4}\b/.test(text)) bine.push(M.telefon_ok);
    else adauga(M.telefon_lipsa);

    /* Ce nu e necesar */
    if (/\b[1-8]\d{12}\b/.test(text)) adauga(M.cnp);
    var inutile = [];
    if (/data nasterii|\bnascut(a)?\b/.test(n)) inutile.push("data nașterii");
    if (/stare civila|\bcasatorit|\bnecasatorit|\bdivortat|\bvaduv/.test(n)) inutile.push("starea civilă");
    if (/\badresa\s*:|\b(str\.|strada|bd\.|bulevardul|bl\.|sc\.|ap\.)\s*\S/.test(n)) inutile.push("adresa completă");
    if (/nationalitate/.test(n)) inutile.push("naționalitatea");
    if (inutile.length) adauga(M.personale, { lista: inutile.join(", ") });
    if (/instagram|tiktok|facebook\.com/.test(n)) adauga(M.retele);

    /* Structura */
    var are = function (k) { return !!(sec[k] && sec[k].join("").trim()); };
    var prezente = ["rezumat", "experienta", "educatie", "competente"].filter(are);
    if (prezente.length >= 3) bine.push(mesaj(M.sectiuni_ok, { lista: prezente.map(function (k) { return NUME_SECTIUNE[k]; }).join(", ") }));
    if (!are("experienta")) adauga(M.lipsa_experienta);
    if (!are("educatie")) adauga(M.lipsa_educatie);
    if (!are("competente") && !are("limbi")) adauga(M.lipsa_competente);
    if (!are("rezumat")) adauga(M.lipsa_rezumat);
    else {
      var rez = sec.rezumat.join(" ").trim(), nr = norm(rez);
      var fraze = (rez.match(/[.!?]+(\s|$)/g) || []).length || 1;
      if (/sa imi gasesc un (job|loc de munca)|caut un (job|loc de munca)\.?$/.test(nr) && rez.length < 80) adauga(M.obiectiv_vag);
      else if (fraze > 3) adauga(M.rezumat_lung, { n: fraze });
    }

    /* Cum descrii experiența */
    if (are("experienta")) {
      var exp = sec.experienta.join("\n"), ne = norm(exp);
      var verbe = {}; (ne.match(VERBE) || []).forEach(function (v) { verbe[v] = 1; });
      if (Object.keys(verbe).length >= 2) bine.push(M.verbe_ok); else adauga(M.verbe_putine);
      if (REZULTAT.test(ne)) bine.push(M.rezultate_ok); else adauga(M.rezultate_lipsa);
    }
    var vagi = D.cuvinte.vagi.filter(function (v) { return n.indexOf(v[0]) >= 0; }).map(function (v) { return "„" + v[1] + "”"; });
    if (vagi.length) adauga(M.vag, { lista: vagi.join(", ") });

    var linii = [];
    ["sus", "rezumat", "experienta", "proiecte"].forEach(function (k) { linii = linii.concat(sec[k] || []); });
    if (linii.some(function (l) { return l.trim().length > 350; })) adauga(M.blocuri);
    var buline = String(text).split(/\r?\n/).filter(function (l) { return BULINA.test(l); }).length;
    if (buline >= 3) bine.push(M.puncte_ok);

    /* Ordinea: cel mai recent primul */
    ["experienta", "educatie"].forEach(function (k) {
      if (!sec[k]) return;
      var ani = sec[k].map(function (l) { var m = l.match(/\b(19|20)\d{2}\b/); return m ? Number(m[0]) : null; }).filter(Boolean);
      if (ani.length >= 2 && ani[0] < ani[ani.length - 1]) adauga(M.ordine, { sectiune: NUME_SECTIUNE[k] });
    });

    /* Limbi străine cu nivel */
    var liniiLimbi = String(text).split(/\r?\n/).filter(function (l) {
      var nl = norm(l); return D.cuvinte.limbi.some(function (x) { return new RegExp("\\b" + x + "\\b").test(nl); });
    });
    if (liniiLimbi.some(function (l) { return !/\b[abc][12]\b|incepator|mediu|avansat|nativ|matern|fluent|conversational|intermediar/.test(norm(l).replace(/nu fluent/, "")); }))
      adauga(M.limbi_nivel);

    /* Diacritice */
    if (String(text).length > 200 && !/[ăâîșțşţĂÂÎȘȚŞŢ]/.test(text) && ((" " + n + " ").match(/ (si|in|sa) /g) || []).length >= 2) adauga(M.diacritice);

    /* Prescurtări */
    var obisnuite = D.cuvinte.prescurtariObisnuite, gasite = {};
    String(text).split(/\r?\n/).forEach(function (l) {
      var litere = l.replace(/[^A-Za-zĂÂÎȘȚăâîșț]/g, ""), mari = l.replace(/[^A-ZĂÂÎȘȚ]/g, "");
      if (!litere.length || mari.length / litere.length > 0.6) return; /* sare peste titlurile scrise cu majuscule */
      (l.match(/\b[A-Z]{2,5}\b/g) || []).forEach(function (a) { if (obisnuite.indexOf(a) < 0) gasite[a] = 1; });
    });
    var acr = Object.keys(gasite).slice(0, 4);
    if (acr.length) adauga(M.acronime, { lista: acr.join(", ") });

    /* Răspunsurile la întrebări (ce nu se vede în text) */
    D.intrebari.forEach(function (q) {
      var r = raspunsuri && raspunsuri[q.id], ef = r && q[r];
      if (!ef) return;
      if (ef.bine) bine.push(ef.bine); else adauga(ef);
    });

    schimba.forEach(function (x, i) { x.i = i; });
    schimba.sort(function (a, b) { return a.p - b.p || a.i - b.i; });

    var ctx = context || {}, sfaturi = [];
    if (ctx.situatie && D.situatii[ctx.situatie]) sfaturi.push(D.situatii[ctx.situatie]);
    if (ctx.varsta === "45+") sfaturi.push(D.situatii.accent45);

    return { bine: bine, schimba: schimba.map(function (x) { return x.t; }), sfaturi: sfaturi, cuvinte: cuvinte };
  }

  /* Subagent 9: textul de copiat într-un chat cu IA. Nu conține textul CV-ului și nici vârsta omului. Calcul pur. */
  function promptIA(analiza, context) {
    var P = D.ia.prompt, ctx = context || {}, l = [P.inceput, ""];
    if (ctx.situatie && P.situatii[ctx.situatie]) l.push(P.situatii[ctx.situatie]);
    if (ctx.varsta === "45+") l.push(P.accent45);
    if (ctx.situatie || ctx.varsta === "45+") l.push("");
    l.push("Reguli:");
    P.reguli.forEach(function (r) { l.push("- " + r); });
    l.push("");
    /* „textul pare foarte scurt” e un sfat pentru om, nu pentru programul de IA */
    var pr = ((analiza && analiza.schimba) || []).filter(function (t) { return t !== D.mesaje.scurt.t; });
    if (pr.length) { l.push(P.probleme); pr.forEach(function (t, i) { l.push((i + 1) + ". " + t); }); }
    else l.push(P.fara_probleme);
    l.push("", P.final, P.loc);
    return l.join("\n");
  }
  function textulCV() { return textCV || (S.ia("cv.pastreaza", false) ? S.ia("cv.text", "") : ""); }
  function context() { return { situatie: S.ia("situatie", ""), varsta: S.ia("varsta", "") }; }

  /* ---- Ecrane ---- */
  function intro() {
    var pastreaza = S.ia("cv.pastreaza", false);
    var val = textCV || (pastreaza ? S.ia("cv.text", "") : "");
    var corp = (C.bosi ? C.bosi(g.DATE.sfaturi.idei.imperfectCV) : "") + (C.butonLectie ? C.butonLectie("cv") : "") + D.intro.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '<div class="camp"><label for="c-cv-text">Textul CV-ului</label>' +
      '<textarea id="c-cv-text" rows="12" spellcheck="false">' + C.escSimplu(val) + "</textarea></div>" +
      '<label class="val"><input type="checkbox" data-chg="cv.pastreaza" value="1"' + (pastreaza ? " checked" : "") + "><span>" + esc(D.pastreaza) + "</span></label>" +
      (pastreaza ? "" : '<p class="mic">' + esc(D.nesalvat) + "</p>") +
      '<div class="rand">' + C.buton("Continuă", "cv.continua", null, "continua") + "</div>" + (C.butonDatele ? C.butonDatele() : "");
    return C.pagina("CV-ul meu", corp, "adult/meniu");
  }

  function intrebare(i) {
    var q = D.intrebari[i], cur = S.ia("cv.q." + q.id, "");
    var corp = '<p class="mic">Întrebarea ' + (i + 1) + " din " + D.intrebari.length + "</p>" +
      (i === 0 ? '<p class="termen">' + esc(D.ats) + "</p>" : "") +
      '<fieldset class="intrebare"><legend>' + esc(q.q) + "</legend>" +
      q.optiuni.map(function (o) {
        return '<label class="val"><input type="radio" name="cv-' + q.id + '" value="' + o[0] + '" data-camp="cv.q.' + q.id + '"' + (cur === o[0] ? " checked" : "") + "><span>" + esc(o[1]) + "</span></label>";
      }).join("") + "</fieldset>" +
      '<div class="rand">' + C.buton("Înapoi", "nav", i === 0 ? "cv/intro" : "cv/q" + (i - 1)) +
      (i < D.intrebari.length - 1 ? C.buton("Continuă", "nav", "cv/q" + (i + 1), "continua") : C.buton("Văd rezultatul", "cv.rezultat", null, "primar")) + "</div>";
    return C.pagina("Câteva întrebări despre CV", corp, "cv/intro");
  }

  function rezultat() {
    var text = textCV || (S.ia("cv.pastreaza", false) ? S.ia("cv.text", "") : "");
    if (!text.trim()) {
      return C.pagina("Rezultatul verificării", "<p>" + esc(D.pierdut) + '</p><div class="rand">' + C.buton("Lipesc din nou", "nav", "cv/intro", "primar") + "</div>", "cv/intro");
    }
    var r = analizeaza(text, S.ia("cv.q", {}), { situatie: S.ia("situatie", ""), varsta: S.ia("varsta", "") });
    var M = D.mesaje;
    var corp = '<section class="card"><h2>Ce e bine</h2><ul>' +
      (r.bine.length ? r.bine : [M.nimic_bine]).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></section>" +
      '<section class="card"><h2>Ce ai putea schimba</h2>' +
      (r.schimba.length ? '<p class="mic">În ordinea importanței.</p><ol>' + r.schimba.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>"
        : "<p>" + esc(M.nimic_de_schimbat) + "</p>") + "</section>" +
      (r.sfaturi.length ? '<section class="card"><h2>Pentru situația ta</h2>' + r.sfaturi.map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") + "</section>" : "") +
      '<section class="card"><h2>Vrei să-l corectezi cu ajutorul unei IA?</h2><p>' + esc(D.ia.cartela) + '</p><div class="rand">' +
        C.buton("Văd cum", "nav", "cv/ia", "primar") + "</div></section>" +
      '<p class="nota">' + esc(M.nu_pot) + "</p>" +
      '<p class="mic">' + esc(mesaj(M.cuvinte, { n: r.cuvinte })) + "</p>" +
      C.retine("cv") +
      '<div class="rand">' + C.buton("Verific din nou", "nav", "cv/intro") + C.buton("Înapoi la drumul meu", "nav", "adult/meniu", "primar") + "</div>";
    return C.pagina("Rezultatul verificării", corp, "adult/meniu");
  }

  function ghidIA() {
    var I = D.ia, text = textulCV();
    if (!text.trim()) {
      return C.pagina(I.titlu, "<p>" + esc(D.pierdut) + '</p><div class="rand">' + C.buton("Lipesc din nou", "nav", "cv/intro", "primar") + "</div>", "cv/intro");
    }
    var pr = promptIA(analizeaza(text, S.ia("cv.q", {}), context()), context());
    var corp = C.ghidIA() +
      '<p class="alerta"><strong>Atenție:</strong> ' + esc(I.atentie) + "</p>" + C.folosireIA() +
      '<h2>Cum faci</h2><ol class="pasi">' + I.sfaturi.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol>" +
      '<div class="camp"><label for="c-prompt-ia">Promptul de copiat</label>' +
      '<textarea id="c-prompt-ia" rows="14" readonly>' + C.escSimplu(pr) + "</textarea></div>" +
      '<div class="rand">' + C.buton("Copiază", "cv.copiaza", null, "continua") + "</div>" +
      '<p id="stare-copiere" class="mic" role="status"></p>' +
      '<div class="rand">' + C.buton("Înapoi la rezultat", "nav", "cv/rezultat") + C.buton("Înapoi la drumul meu", "nav", "adult/meniu", "primar") + "</div>";
    return C.pagina(I.titlu, corp, "cv/rezultat");
  }

  C.reg("cv", {
    ecran: function (sub) {
      var m = /^q(\d)$/.exec(sub || "");
      if (m && D.intrebari[Number(m[1])]) return intrebare(Number(m[1]));
      if (sub === "rezultat") return rezultat();
      if (sub === "ia") return ghidIA();
      return intro();
    },
    actiuni: {
      pastreaza: function (v, el) {
        var cutie = g.document && g.document.getElementById("c-cv-text");
        if (cutie) textCV = cutie.value;
        S.pune("cv.pastreaza", !!el.checked);
        if (!el.checked) S.pune("cv.text", "");
        else if (textCV) S.pune("cv.text", textCV);
      },
      continua: function () {
        var cutie = g.document && g.document.getElementById("c-cv-text");
        textCV = cutie ? cutie.value : textCV;
        if (!textCV.trim()) { C.eroare = D.gol; return; }
        S.pune("cv.text", S.ia("cv.pastreaza", false) ? textCV : "");
        C.mergi("cv/q0");
      },
      rezultat: function () { S.pune("cv.verificat", true); C.mergi("cv/rezultat"); },
      /* Copiază promptul; dacă telefonul nu lasă, selectează textul ca omul să-l copieze singur. */
      copiaza: function () {
        C.copiaza("c-prompt-ia", "stare-copiere", D.ia.copiat, D.ia.selectat);
        return false;
      }
    },
    analizeaza: analizeaza,
    promptIA: promptIA,
    sectiuni: sectiuni,
    /* doar pentru teste */
    _seteazaText: function (t) { textCV = t; }
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Subagent 10: scrisoarea de intenție (doar pentru adulți).
   Pune întrebări una câte una, apoi arată un schelet cu trei paragrafe, făcut din răspunsurile omului.
   Nu scrie scrisoarea în locul omului. Pentru cine vrea, pregătește un prompt de copiat într-un chat cu IA. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, D = g.DATE.scrisoare, esc = C.esc;

  function r(id) { return String(S.ia("scrisoare.r." + id, "") || "").trim(); }
  function inlocuieste(t, valori) {
    Object.keys(valori).forEach(function (k) { t = t.split("{" + k + "}").join(valori[k]); });
    return t;
  }

  function intro() {
    var corp = (C.butonLectie ? C.butonLectie("scrisoare") : "") + D.intro.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '<div class="rand">' + C.buton("Începem", "nav", "scrisoare/q0", "primar") +
      (r("post") || r("atrage") ? C.buton("Văd scheletul", "nav", "scrisoare/schelet") : "") + "</div>";
    return C.pagina(D.titlu, corp, "adult/meniu");
  }

  function ajutor(q) {
    var sit = S.ia("situatie", "");
    var a = (q.ajutorSit && q.ajutorSit[sit]) || q.ajutor;
    if (q.ajutor45 && S.ia("varsta", "") === "45+") a += " " + q.ajutor45;
    return a;
  }

  function intrebare(i) {
    var q = D.intrebari[i], n = D.intrebari.length;
    var corp = '<p class="mic">Întrebarea ' + (i + 1) + " din " + n + "</p>" +
      C.camp("scrisoare.r." + q.id, esc(q.q), esc(ajutor(q)), q.randuri) +
      '<div class="rand">' + C.buton("Înapoi", "nav", i === 0 ? "scrisoare/intro" : "scrisoare/q" + (i - 1)) +
      (i < n - 1 ? C.buton("Continuă", "nav", "scrisoare/q" + (i + 1), "continua") : C.buton("Văd scheletul", "scrisoare.gata", null, "primar")) + "</div>";
    return C.pagina(D.titlu, corp, "scrisoare/intro");
  }

  function schelet() {
    var Sk = D.schelet;
    /* „În zilele lucrătoare.” devine „(în zilele lucrătoare)”, ca să se potrivească în mijlocul propoziției. */
    var disp = r("disponibil").replace(/[\s.!;,]+$/, "");
    if (disp) disp = disp.charAt(0).toLowerCase() + disp.slice(1);
    var val = { firma: esc(r("firma").replace(/[\s.!;,]+$/, "") || Sk.firmaGol), post: esc(r("post").replace(/[\s.!;,]+$/, "") || Sk.postGol), disp: disp ? " (" + esc(disp) + ")" : "" };
    var corp = "<p>" + esc(Sk.explica) + "</p>";
    Sk.paragrafe.forEach(function (p) {
      corp += '<section class="card"><h2>' + esc(p.titlu) + "</h2><p>" + inlocuieste(esc(p.ghid), val) + "</p>";
      p.din.forEach(function (id) {
        var i = D.intrebari.map(function (q) { return q.id; }).indexOf(id);
        corp += '<p class="mic"><strong>' + esc(Sk.etichete[id]) + ":</strong></p>" +
          (r(id) ? '<p class="citat">' + esc(r(id)) + "</p>"
            : '<p class="mic">— ' + esc(Sk.lipsa) + "</p>" + '<div class="rand">' + C.buton("Completez", "nav", "scrisoare/q" + i) + "</div>");
      });
      corp += "</section>";
    });

  /* Scoate cuvintele de început dacă omul le-a scris și el, și punctuația de la sfârșit. */

    var x = String(t || "").trim().replace(/\s+/g, " ").replace(/[\s.,;:!]+$/, "");
    var n = norm(x), i = norm(inceput);
    if (i && (n.indexOf(i + " ") === 0 || n.indexOf(i + ",") === 0)) x = x.slice(inceput.length).replace(/^[\s,]+/, "").trim();
    else if (i === "ma simt" && n.indexOf("simt ") === 0) x = x.slice(5).trim();
    else if (i === "propun sa" && n.indexOf("propun ") === 0) x = x.slice(7).trim();
    if (i === "propun sa" && norm(x).indexOf("sa ") === 0) x = x.slice(3).trim();
    return x;
  }
  function primaMica(t) { return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

  /* Calcul pur: fraza întreagă și ce e de îmbunătățit. */
  function verificaModel(r) {
    var M = D.model, R = M.reguli, p = {}, lipsa = [], sfaturi = [], bine = [];
    M.parti.forEach(function (x) { p[x.id] = curata(r && r[x.id], x.inceput); if (!p[x.id]) lipsa.push(mesaj(M.lipsa, { parte: x.t.split("…")[0] + "…" })); });
    var fraza = lipsa.length ? "" : "Când " + primaMica(p.cand) + ", mă simt " + primaMica(p.simt) + ", pentru că " + primaMica(p.motiv) + ". Propun să " + primaMica(p.vreau) + ".";
    if (!lipsa.length) {
      var c = norm(p.cand), s = norm(p.simt), m = norm(p.motiv), v = norm(p.vreau), gasit;
      if ((gasit = c.match(/\b(lenes|lenesa|prost|proasta|incompetent|incompetenta|neserios|neserioasa|egoist|egoista|nesimtit|nesimtita|iresponsabil|iresponsabila|dezordonat|dezordonata)\b/))) sfaturi.push(mesaj(R.eticheta, { gasit: "„" + gasit[0] + "”" }));
      if ((gasit = c.match(/\b(mereu|niciodata|tot timpul|intotdeauna|de fiecare data)\b/))) sfaturi.push(mesaj(R.absolut, { gasit: gasit[0] }));
      if ((gasit = c.match(/\b(esti|sunteti)\b/))) sfaturi.push(mesaj(R.tuEsti, { gasit: gasit[0] }));
      if (/^ca\b|\bca tu\b|\bca voi\b|\bca dumneavoastra\b/.test(s)) sfaturi.push(R.simtCa);
      else if (/\b(tu|tine|voi|dumneavoastra|el|ea)\b/.test(s)) sfaturi.push(R.simtTu);
      else if (/\b(ingrijorat|frustrat|coplesit|nedreptatit|suparat|stresat|trist|nelinistit|nervos|dezamagit|nesigur|jenat|ranit|nemultumit|incurcat|obosit|neliniste|furios|ignorat|nepretuit|nevazut|presat|epuizat|neglijat|neinteles|confuz|tensionat)/.test(s)) bine.push(M.simtCunoscut);
      if ((gasit = m.match(/\b(tu esti|tu nu|din cauza ta|vina ta|ai gresit|nu iti pasa|nu va pasa|esti)\b/))) sfaturi.push(mesaj(R.motivVina, { gasit: "„" + gasit[0] + "”" }));
      if ((gasit = v.match(/\b(altfel|sau o sa|daca nu|o sa vezi|ma plang|plec)\b/))) sfaturi.push(mesaj(R.vreauAmenintare, { gasit: "„" + gasit[0] + "”" }));
      if ((gasit = v.match(/\b(te schimbi|fii altfel|fii mai bun|fii mai buna|te porti frumos|ma respecti|intelegi)\b/))) sfaturi.push(mesaj(R.vreauVag, { gasit: "„" + gasit[0] + "”" }));
      else if (/^nu mai\b/.test(v) && !/\b(ci|in schimb)\b/.test(v)) sfaturi.push(R.vreauNegativ);
    }
    return { fraza: fraza, lipsa: lipsa, sfaturi: sfaturi, bine: bine, asertiv: !lipsa.length && !sfaturi.length };
  }
  function mesaj(t, v) { Object.keys(v || {}).forEach(function (k) { t = t.split("{" + k + "}").join(v[k]); }); return t; }

  function modelHtml() {
    var M = D.model, r = S.ia("asertiv.model", {}) || {};
    var corp = '<section class="card stil-asertiv"><h2>' + esc(M.titlu) + "</h2><p>" + esc(M.explica) + '</p><p class="mic">' + esc(pentruElev() ? D.elev.modelExemplu : M.exemplu) + "</p></section>" +
      M.parti.map(function (x) { return C.camp("asertiv.model." + x.id, esc(x.t), esc(x.ajutor), 2); }).join("") +
      '<div class="rand">' + C.buton(esc(M.buton), "asertiv.verifica", null, "continua") + "</div>";
    if (S.ia("asertiv.modelVerificat", false)) {
      var v = verificaModel(r);
      corp += '<div id="rezultat-model">';
      if (v.lipsa.length) {
        corp += '<section class="card"><h2>' + esc(M.incomplet) + "</h2><ul>" + v.lipsa.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></section>";
      } else {
        corp += '<section class="card"><h2>' + esc(M.fraza) + '</h2><p class="citat">' + esc(v.fraza) + "</p></section>" +
          '<section class="card' + (v.asertiv ? " stil-asertiv" : "") + '"><h2>' + esc(v.asertiv ? M.bine : M.aproape) + "</h2>" +
          (v.bine.length ? "<p>" + v.bine.map(esc).join(" ") + "</p>" : "") +
          (v.sfaturi.length ? "<ul>" + v.sfaturi.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" : "") +
          '<p class="mic">' + esc(M.sfat) + "</p></section>";
      }
      corp += "</div>";
    }
    return corp;
  }

  /* ---- Cere clar și de la IA ---- */
  function cartelaIA() {
    return '<section class="card"><h2>' + esc(D.ia.titlu) + "</h2><p>" + esc(D.ia.intro) + '</p><div class="rand">' +
      C.buton("Văd regulile", "nav", "asertiv/ia", "continua") + "</div></section>";
  }
  /* Calcul pur: întrebarea pentru IA, din cele trei părți. */
  function intrebareIA(r) {
    var P = D.ia.model.parti, p = {}, lipsa = false;
    P.forEach(function (x) { p[x.id] = curata(r && r[x.id], x.inceput); if (!p[x.id]) lipsa = true; });
    if (lipsa) return "";
    return "Sunt " + primaMica(p.cine) + ". Vreau " + primaMica(p.ce) + ". Te rog " + primaMica(p.cum) + ".";
  }
  function ecranIA() {
    var I = D.ia, M = I.model;
    var corp = "<p>" + esc(I.intro) + '</p><ol class="pasi">' +
      I.reguli.map(function (x) { return "<li><strong>" + esc(x.t) + "</strong> " + esc(x.ex) + "</li>"; }).join("") + "</ol>" +
      '<p class="nota">' + esc(I.varsta) + "</p>";
    I.quiz.forEach(function (q, i) {
      var ales = S.ia("asertiv.iaq." + i, "");
      corp += '<section class="card"><h2>' + esc(I.intrebare) + " (" + (i + 1) + " din " + I.quiz.length + ")</h2>";
      corp += '<div class="meniu-lista">' + ["a", "b"].map(function (k) {
        var cls = !ales ? "lista" : (k === q.corect ? "lista salvat" : "lista");
        return C.buton((ales && k === q.corect ? "✓ " : "") + esc(q[k]), "asertiv.iaAlege", i + "|" + k, cls);
      }).join("") + "</div>";
      if (ales) corp += '<p class="' + (ales === q.corect ? "felicitare" : "mic") + '">' + esc(ales === q.corect ? I.bine : I.gresit) + " " + esc(q.expl) + "</p>";
      corp += "</section>";
    });
    corp += "<h2>" + esc(M.titlu) + "</h2>" +
      M.parti.map(function (x) { return C.camp("asertiv.iam." + x.id, esc(x.t), esc(x.ajutor), 2); }).join("") +
      '<div class="rand">' + C.buton(esc(M.buton), "asertiv.iaVad", null, "continua") + "</div>";
    if (S.ia("asertiv.iaVazut", false)) {
      var q = intrebareIA(S.ia("asertiv.iam", {}));
      corp += '<div id="rezultat-ia">' + (q
        ? '<section class="card stil-asertiv"><h2>' + esc(M.gata) + '</h2><div class="camp"><label for="c-intrebare-ia">' + esc(M.gata) + '</label><textarea id="c-intrebare-ia" rows="3" readonly>' + C.escSimplu(q) + "</textarea></div>" +
          '<div class="rand">' + C.buton("Copiază", "asertiv.iaCopiaza", null, "continua") + '</div><p id="stare-copiere-ia" class="mic" role="status"></p><p>' + esc(M.sfat) + "</p></section>"
        : '<section class="card"><p>' + esc(M.gol) + "</p></section>") + "</div>";
    }
    corp += "<details><summary>" + esc(I.primaData) + "</summary>" + C.ghidIA() + "</details>" +
      '<div class="rand">' + C.buton("Înapoi", "nav", "asertiv/intro", "primar") + "</div>";
    return C.pagina(I.titlu, corp, "asertiv/intro");
  }

  function exercitiu() {
    var F = D.formula, X = D.exercitiu;
    var pasi = pentruElev() ? [D.elev.formulaPrimul].concat(F.pasi.slice(1)) : F.pasi;
    var corp = '<section class="card"><h2>' + esc(F.titlu) + '</h2><ol class="pasi">' + pasi.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol></section>" +
      '<section class="card"><h2>' + esc(D.corp.titlu) + "</h2>" + lista(D.corp.lista) + "</section>" +
      "<h2>" + esc(X.titlu) + "</h2>" +
      C.camp("asertiv." + X.campuri[0].id, esc(X.campuri[0].t), esc(pentruElev() ? D.elev.situatieAjutor : X.campuri[0].ajutor), X.campuri[0].randuri) +
      modelHtml() +
      X.campuri.slice(1).map(function (c) { return C.camp("asertiv." + c.id, esc(c.t), esc(c.ajutor), c.randuri); }).join("") +
      cartelaIA() + (C.module.exercitii && !pentruElev() ? C.module.exercitii.cartela("asertiv") : "");
    corp += C.retine("asertiv");
    var u = C.eAdult() && C.module.adult ? C.module.adult.urmator("asertiv") : null;
    corp += '<div class="rand">' + C.buton("Înapoi la exemple", "nav", "asertiv/exemplu/" + N) +
      C.buton(u ? "Gata. Continuă: " + esc(u.t) : "Gata", "asertiv.gata", u ? u.ecran : C.acasa(), "primar") + "</div>";
    return C.pagina(X.titlu, corp, "asertiv/intro");
  }

  C.reg("asertiv", {
    ecran: function (sub) {
      var m = /^exemplu\/(\d)$/.exec(sub || "");
      if (m && Number(m[1]) >= 1 && Number(m[1]) <= N) return exemplu(Number(m[1]));
      if (sub === "exercitiu") return exercitiu();
      if (sub === "ia") return ecranIA();
      return intro();
    },
    actiuni: {
      gata: function (unde) { S.pune("asertiv.gata", true); C.mergi(unde || C.acasa()); },
      iaAlege: function (arg) { var p = String(arg).split("|"); S.pune("asertiv.iaq." + p[0], p[1]); },
      iaVad: function () {
        D.ia.model.parti.forEach(function (x) {
          var el = g.document && g.document.getElementById("c-asertiv-iam-" + x.id);
          if (el) S.pune("asertiv.iam." + x.id, el.value);
        });
        S.pune("asertiv.iaVazut", true); C.deArata = "rezultat-ia";
      },
      iaCopiaza: function () { C.copiaza("c-intrebare-ia", "stare-copiere-ia", D.ia.model.copiat, D.ia.model.selectat); return false; },
      verifica: function () {
        /* textul e deja salvat la fiecare literă; ne asigurăm că și ultima literă a intrat */
        D.model.parti.forEach(function (x) {
          var el = g.document && g.document.getElementById("c-asertiv-model-" + x.id);
          if (el) S.pune("asertiv.model." + x.id, el.value);
        });
        S.pune("asertiv.modelVerificat", true);
        C.deArata = "rezultat-model";
      }
    },
    verificaModel: verificaModel,
    intrebareIA: intrebareIA
  });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* Exerciții interactive pentru discuții: patru la comunicarea asertivă (complimentul, cererea cu motiv,
   glumă sau batjocură, argumentele nedrepte) și cinci la pregătirea pentru interviu (pauza de două secunde,
   încălzirea vocii, începutul și finalul, cuvintele firmei, două întrebări și o poveste).
   Totul se face local, pe telefon. */
(function (g) {
  "use strict";
  var C = g.Cariera, S = g.Stocare, D = g.DATE.exercitii, esc = C.esc;
  var ceas = null; /* cronometrul care merge acum (doar unul odată) */

  function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

  /* Exercițiile și unde se întorc. */
  var ASERTIV = [
    { id: "quiz/compliment", t: D.quiz.compliment.titlu },
    { id: "cerere", t: D.cerere.titlu },
    { id: "quiz/gluma", t: D.quiz.gluma.titlu },
    { id: "argumentez", t: D.argumentez.titlu }
  ];
  var INTERVIU = [
    { id: "pauza", t: D.pauza.titlu },
    { id: "voce", t: D.voce.titlu },
    { id: "capete", t: D.capete.titlu },
    { id: "cuvinte", t: D.cuvinte.titlu },
    { id: "intrebari", t: D.intrebari.titlu }
  ];
  function inapoiPentru(id) {
    return id === "quiz/argumente" || ASERTIV.some(function (x) { return x.id === id || id.indexOf(x.id) === 0; }) ? "asertiv/intro" : "interviu/exersez";
  }

  /* Cartela cu butoanele exercițiilor, pusă în alte ecrane. */
  function cartela(grup) {
    var G = grup === "asertiv" ? D.grupAsertiv : D.grupInterviu, lista = grup === "asertiv" ? ASERTIV : INTERVIU;
    return '<section class="card"><h2>' + esc(G.titlu) + "</h2><p>" + esc(G.explica) + '</p><div class="meniu-lista">' +
      lista.map(function (x) { return C.buton("<strong>" + esc(x.t) + "</strong>", "nav", "exercitii/" + x.id, "lista"); }).join("") + "</div></section>";
  }

  /* ---- Cronometru: actualizează doar bara și textul, fără să redeseneze pagina ---- */
  function cronometruHtml(id, sec) {
    return '<progress class="progres" id="' + id + '" max="' + sec + '" value="0" aria-label="Cronometru"></progress>' +
      '<p class="mic" id="' + id + '-t" role="status">' + sec + " " + esc(D.cronometru.din) + "</p>" +
      '<div class="rand">' + C.buton(esc(D.cronometru.porneste), "exercitii.cronometru", id + "|" + sec) + "</div>";
  }
  function pornesteCeas(id, sec, laSfarsit, textMers) {
    var doc = g.document; if (!doc) return;
    if (ceas) g.clearInterval(ceas);
    var start = Date.now();
    ceas = g.setInterval(function () {
      var bara = doc.getElementById(id), txt = doc.getElementById(id + "-t");
      if (!bara) { g.clearInterval(ceas); ceas = null; return; } /* omul a plecat de pe ecran */
      var trecut = Math.min((Date.now() - start) / 1000, sec);
      bara.value = trecut;
      if (txt) txt.textContent = textMers ? textMers : Math.ceil(sec - trecut) + " " + D.cronometru.din;
      if (trecut >= sec) {
        g.clearInterval(ceas); ceas = null;
        if (txt) txt.textContent = laSfarsit || D.cronometru.gata;
      }
    }, 100);
  }

  /* ---- Exerciții cu alegere ---- */
  function quiz(id, i) {
    var Q = D.quiz[id], n = Q.itemi.length, it = Q.itemi[i], ales = S.ia("ex.q." + id + "." + i, null);
    var corp = (i === 0 ? "<p>" + esc(Q.intro) + "</p>" : "") +
      (id === "argumente" && i === 0 ? '<section class="card"><h2>Patru feluri de argumente nedrepte</h2><ul>' +
        Q.tipuri.map(function (t) { return "<li><strong>" + esc(t.t) + ":</strong> " + esc(t.d) + "</li>"; }).join("") + "</ul></section>" : "") +
      '<p class="mic">Situația ' + (i + 1) + " din " + n + "</p>" +
      '<section class="card"><p>' + esc(it.situatie) + "</p></section>";

    if (it.variante) { /* alegi răspunsul cel mai potrivit */
      corp += "<h2>Ce ai răspunde?</h2>";
      if (ales === null) {
        corp += '<div class="meniu-lista">' + it.variante.map(function (v, k) {
          return C.buton(esc(v.t), "exercitii.alege", id + "|" + i + "|" + k, "lista");
        }).join("") + "</div>";
      } else {
        it.variante.forEach(function (v, k) {
          var a = String(k) === String(ales);
          corp += '<section class="card' + (v.ok ? " stil-asertiv" : " varianta") + '"><h2>' + (v.ok ? "✓ Potrivit" : "✗ Mai puțin potrivit") + (a ? " · alegerea ta" : "") + "</h2>" +
            "<p>" + esc(v.t) + '</p><p class="mic">' + esc(v.expl) + "</p></section>";
        });
      }
    } else { /* recunoști felul situației */
      var opt = Q.optiuni || Q.tipuri.map(function (t) { return [t.id, t.t]; });
      corp += "<h2>" + esc(Q.intrebare) + "</h2>";
      if (ales === null) {
        corp += '<div class="meniu-lista">' + opt.map(function (o) {
          return C.buton(esc(o[1]), "exercitii.alege", id + "|" + i + "|" + o[0], "lista");
        }).join("") + "</div>";
      } else {
        var bine = ales === it.corect, numeCorect = opt.filter(function (o) { return o[0] === it.corect; })[0][1];
        corp += '<section class="card ' + (bine ? "stil-asertiv" : "varianta") + '"><h2>' + (bine ? "✓ Ai recunoscut-o" : "✗ Nu chiar") + "</h2>" +
          "<p><strong>Este: " + esc(numeCorect) + ".</strong>" + (it.expl ? " " + esc(it.expl) : "") + "</p></section>" +
          '<section class="card stil-asertiv"><h2>Un răspuns calm</h2><p class="citat">' + esc(it.raspuns) + "</p></section>";
        if (id === "argumente" && i === n - 1) corp += '<p class="termen">' + esc(Q.sfat) + "</p>";
      }
    }
    corp += '<div class="rand">' + (ales !== null ? C.buton("Încerc din nou", "exercitii.reia", id + "|" + i) : "") +
      (i < n - 1 ? C.buton("Situația următoare", "nav", "exercitii/quiz/" + id + "/" + (i + 1), "continua")
        : C.buton("Gata", "nav", inapoiPentru("quiz/" + id), "primar")) + "</div>";
    return C.pagina(Q.titlu, corp, i > 0 ? "exercitii/quiz/" + id + "/" + (i - 1) : (id === "argumente" ? "exercitii/argumentez" : inapoiPentru("quiz/" + id)));
  }

  /* ---- Cum să argumentezi: ideile principale și „Argumentul meu” ---- */
  function propozitie(t) {
    var x = String(t || "").trim().replace(/\s+/g, " ").replace(/[\s.,;:!]+$/, "");
    return x ? x.charAt(0).toUpperCase() + x.slice(1) + "." : "";
  }
  function inlocuieste(t, v) { Object.keys(v || {}).forEach(function (k) { t = t.split("{" + k + "}").join(v[k]); }); return t; }
  /* Calcul pur: argumentul întreg și ce l-ar face mai convingător. */
  function verificaArgument(r) {
    var M = D.argumentez.model, R = M.reguli, p = {}, lipsa = [], sfaturi = [], bine = [];
    M.parti.forEach(function (x) { p[x.id] = String((r && r[x.id]) || "").trim(); if (!p[x.id]) lipsa.push(inlocuieste(M.lipsa, { parte: x.t.split(" (")[0] })); });
    if (lipsa.length) return { argument: "", lipsa: lipsa, sfaturi: [], bine: [], bun: false };
    var ex = p.exemplu.replace(/^\s*(de exemplu|exemplu)\s*[,:]?\s*/i, "");
    /* Dacă motivul începe cu „ca să”, „pentru că”…, se leagă de idee cu virgulă, în aceeași propoziție. */
    var leaga = /^(ca sa|pentru ca|pentru a|fiindca|deoarece|intrucat|caci|ca)\b/.test(norm(p.motiv));
    var inceput = leaga ? propozitie(p.idee).replace(/\.$/, "") + ", " + propozitie(p.motiv).replace(/^./, function (c) { return c.toLowerCase(); }) : propozitie(p.idee) + " " + propozitie(p.motiv);
    var argument = [inceput, "De exemplu, " + propozitie(ex).replace(/^./, function (c) { return c.toLowerCase(); }), propozitie(p.propunere)].join(" ");
    var n = { idee: norm(p.idee), motiv: norm(p.motiv), exemplu: norm(ex), propunere: norm(p.propunere) }, tot = [n.idee, n.motiv, n.exemplu, n.propunere].join(" "), gasit;
    if ((p.idee.match(/[.!?](\s|$)/g) || []).length > 1 || p.idee.length > 160) sfaturi.push(R.ideeLunga);
    if (p.motiv.length < 12) sfaturi.push(R.motivScurt);
    if ((gasit = tot.match(/\b(mereu|niciodata|toata lumea|toti stiu|intotdeauna|tot timpul)\b/))) sfaturi.push(inlocuieste(R.absolut, { gasit: gasit[0] }));
    if ((gasit = tot.match(/\b(tu nu stii|nu ai inteles|nu va pricepeti|esti prea|sunteti prea|nu te pricepi|habar n-ai|habar nu ai)\b/))) sfaturi.push(inlocuieste(R.persoana, { gasit: gasit[0] }));
    if (/\d|\b(ieri|azi|saptamana trecuta|luna trecuta|anul trecut|de doua ori|de trei ori|luni|marti|miercuri|joi|vineri)\b/.test(n.exemplu)) bine.push(M.laude.exemplu);
    else if (/\b(de obicei|in general|uneori|cateodata|des)\b/.test(n.exemplu)) sfaturi.push(R.exempluVag);
    if ((gasit = n.propunere.match(/\b(sa fie mai bine|sa ne schimbam|sa ne straduim|sa ne descurcam mai bine|sa facem ceva)\b/))) sfaturi.push(inlocuieste(R.propunereVaga, { gasit: "„" + gasit[0] + "”" }));
    else if (/\b(incercam|incepem|proba|saptamani|saptamana|o luna|de luni|pana|zile|ora|minute)\b/.test(n.propunere)) bine.push(M.laude.propunere);
    return { argument: argument, lipsa: [], sfaturi: sfaturi, bine: bine, bun: !sfaturi.length };

  function cuvinteFrecvente(text) {
    var K = D.cuvinte, nr = {}, forma = {}, ordine = [];
    (String(text || "").match(/[A-Za-zĂÂÎȘȚăâîșțŞŢşţ-]+/g) || []).forEach(function (w) {

      if (k.length < 4 || K.ignorate.indexOf(k) >= 0) return;

      nr[k]++;
    });
    return ordine.filter(function (k) { return nr[k] >= 2; })
      .sort(function (a, b) { return nr[b] - nr[a] || ordine.indexOf(a) - ordine.indexOf(b); })

    var corp = "<p>" + esc(K.intro) + "</p>" + C.camp("ex.cuvinte.text", esc(K.camp), "", 8) +

  C.reg("exercitii", {
    ecran: function (sub) {
      var m = /^quiz\/([a-z]+)(?:\/(\d+))?$/.exec(sub || "");

      var f = { argumentez: argumentez, cerere: cerere, pauza: pauza, voce: voce, capete: capete, cuvinte: cuvinte, intrebari: intrebari }[sub];
      return f ? f() : C.module.asertiv.ecran("intro");

      verificaCerere: function () {
        var t = g.document && g.document.getElementById("c-ex-cerere-text");
